<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shunt — requisições</title>
<link rel="stylesheet" href="/shunt.css">
<style>
  
  
  
  a { color: var(--requests); }

  #count { margin-left: auto; color: var(--muted); font-size: 12.5px; font-family: var(--mono); }

  form {
    display: grid;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--edge);
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spacer { flex: 1 1 auto; }

  input[type="search"] { flex: 1 1 320px; min-width: 200px; }
  input[type="datetime-local"] { color-scheme: dark; font-size: 12.5px; }
  #range { display: flex; gap: 6px; flex-wrap: wrap; }
  /* `display: flex` na classe vence o `display: none` que o navegador dá ao
     atributo `hidden` -- o mesmo tropeço do filtro de erros na outra tela. */
  #range[hidden] { display: none; }
  #range input { min-width: 0; flex: 1 1 150px; }
  input[type="number"] { width: 10ch; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  /* A tabela ocupa a tela inteira enquanto ninguem escolheu nada: um painel
     de detalhe vazio roubava um terco da largura para dizer "escolha algo". */
  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  main.with-detail { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  aside[hidden] { display: none; }
  .list { overflow-x: auto; padding: 4px 20px 0 20px; scrollbar-gutter: stable; }
  /* Sem teto, a tabela em tela cheia estica e abre um vao morto entre o nome
     do modelo e os numeros. O teto mantem a linha legivel de ponta a ponta. */
  .list table { max-width: 1120px; }
  main.with-detail .list { padding-right: 0; }
  main.with-detail .list table { max-width: none; }

  th[role="button"] { cursor: pointer; }
  th[aria-sort] { color: var(--ink); }
  th[aria-sort]::after { content: " ↓"; color: var(--requests); }

  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr[aria-selected="true"] { background: #2b2924; box-shadow: inset 3px 0 0 var(--requests); }
  .when { font-family: var(--mono); color: var(--dim); }
  .status { font-family: var(--mono); }
  .status.bad { color: var(--error-text); }
  .tag { color: var(--muted); font-size: 12px; }
  .tag.fell { color: var(--fallback-text); }
  .tag.bad { color: var(--error-text); }
  .mark {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 3px;
    font-size: 11px;
    color: var(--muted);
    background: #262420;
  }
  .mark.fell { color: var(--fallback-text); }
  .mark.tool { color: var(--ink); background: #2f2b23; }
  .signals .mark:first-child { margin-left: 0; }
  .signals .none { color: var(--dim); }
  /* Linha que falhou se anuncia pela borda, e não só pelo número no fim. */
  tbody tr.failed { box-shadow: inset 3px 0 0 var(--error); }
  tbody tr.failed[aria-selected="true"] { box-shadow: inset 3px 0 0 var(--error), inset 0 0 0 1px var(--edge-strong); }

  aside {
    border-left: 1px solid var(--edge);
    padding: 18px 20px 20px;
    background: var(--panel);
    position: sticky;
    top: 0;
    align-self: start;
    max-height: 100vh;
    overflow-y: auto;
    scrollbar-gutter: stable;
  }

  .detail-head {
    display: flex;
    gap: 12px;
    align-items: baseline;
    justify-content: space-between;
  }

  aside h2 {
    margin: 0 0 5px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  aside .id { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
  aside dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 16px 0; font-size: 13px; }
  aside dt { color: var(--dim); }
  aside dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  aside h3 { margin: 18px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .chain { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .chain li {
    position: relative;
    padding: 4px 0 4px 18px;
    border-left: 1px solid var(--edge);
    margin-left: 4px;
  }
  .chain li::before {
    content: "";
    position: absolute;
    left: -4px;
    top: 11px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--error);
  }
  .chain li.won::before { background: var(--good); }
  .chain li b { font-weight: 500; }
  .chain li small { color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill {
    font-size: 11.5px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 1px 9px;
    color: var(--muted);
  }
  .pill.used { color: var(--ground); background: var(--requests); border-color: var(--requests); }
  .rest { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .rest summary { cursor: pointer; color: var(--dim); }
  .rest .pills { margin-top: 8px; max-height: 180px; overflow: auto; }

  /* A conversa: cada turno é um bloco, e o papel de quem falou manda na cor
     da margem. Ler um turno agêntico é seguir quem disse o quê, e não decorar
     uma legenda. */
  .talk { display: grid; gap: 10px; }
  .turn {
    border-left: 3px solid var(--edge);
    padding: 2px 0 2px 12px;
  }
  .turn.user { border-color: var(--requests); }
  .turn.assistant { border-color: var(--tokens); }
  .turn.system { border-color: var(--dim); }
  .turn.tool { border-color: var(--fallback); }
  .turn .who {
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .turn pre {
    margin: 3px 0 0;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 18em;
    overflow: auto;
  }
  .turn.open pre { max-height: none; }
  .turn .more {
    font: inherit;
    font-size: 11.5px;
    color: var(--requests);
    background: transparent;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
  }
  .talk mark { background: rgba(196, 122, 28, 0.40); color: inherit; }

  /* A leitura do modelo é prosa, e prosa em fonte monoespaçada com 90 colunas
     cansa: texto em sans, medida presa, e as quebras de linha preservadas
     porque a resposta vem numerada. */
  .read {
    word-break: break-word;
    line-height: 1.65;
    max-width: 68ch;
    margin: 10px 0 14px;
  }
  .read p { margin: 0 0 10px; }
  .read h4 { margin: 16px 0 6px; font-size: 13px; }
  .read ul { margin: 0 0 10px; padding-left: 18px; }
  .read li { margin: 0 0 6px; }
  .read code {
    font-family: var(--mono);
    font-size: 12px;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.06);
  }
  /* O dossiê é o oposto: número alinhado, em monoespaçada, com rolagem própria
     -- ele existe para ser CONFERIDO, e não lido de ponta a ponta. */
  pre.raw {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre;
    overflow: auto;
    max-height: 60vh;
    margin: 8px 0 0;
    padding: 10px;
    border: 1px solid var(--edge);
    border-radius: 6px;
  }
  .body-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin: 4px 0 10px;
  }
  .body-bar input[type="search"] { flex: 1 1 140px; min-width: 120px; font-size: 12.5px; }
  .cut { color: var(--tokens); font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin: 16px 0 10px; }
  .tabs button {
    font: inherit;
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 3px 12px;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    color: var(--ground);
    background: var(--ink);
    border-color: var(--ink);
    font-weight: 600;
  }
  footer {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 14px 20px;
    color: var(--dim);
    font-size: 12.5px;
  }

  /* Entre 900 e 1280 a tabela divide a tela com o detalhe e não cabe inteira.
     A rota é quase sempre a mesma e cede o lugar para duração e status, que é
     o que alguém está procurando. */
  @media (max-width: 1280px) and (min-width: 721px) {
    /* Entre 900 e 1280 a tabela divide a largura com o painel: a rota e o
       projeto cedem primeiro -- a rota é quase sempre a mesma, e o projeto tem
       seletor próprio logo acima. */
    th.route, td.route, th.project, td.project { display: none; }
    .scroll table, table { min-width: 0; }
  
  }

  @media (max-width: 900px) {
    form > * { min-width: 0; }
    #range { width: 100%; }
    /* `main.with-detail` tem mais especificidade que `main`, entao repetir a
       classe aqui e o que faz o empilhamento valer: sem isso o painel abria com
       150px de largura no telefone, e a leitura saia em coluna de 100px. */
    main, main.with-detail { grid-template-columns: 1fr; }
    aside {
      border-left: 0;
      border-top: 1px solid var(--edge);
      position: static;
      max-height: none;
    }
    #count { margin-left: 0; }
  }

  /* No telefone a tabela não cabe: sete colunas cortadas não são uma tabela.
     Cada linha vira um cartão, com o nome da coluna ao lado do valor — o mesmo
     HTML, lido de outro jeito. */
  @media (max-width: 720px) {
    .list { overflow-x: visible; }
    .scroll table, table { min-width: 0; }
    thead { display: none; }
    tbody tr {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--edge);
    }
    tbody td { border: 0; padding: 0; white-space: normal; }
    tbody td::before {
      content: attr(data-label);
      color: var(--dim);
      font-size: 11.5px;
      margin-right: 8px;
    }
    tbody td.n, tbody td.when { text-align: left; }
    /* A hora e o status ficam na mesma primeira linha do cartão: são o "quando"
       e o "deu certo?", que é o par que se lê primeiro. */
    tbody td.when { grid-area: 1 / 1; font-size: 13px; }
    tbody td.when::before { content: none; }
    tbody td.status { grid-area: 1 / 2; text-align: right; }
    tbody td.status::before { content: none; }
    .chips { overflow-x: auto; padding-bottom: 2px; }
    .chips .chip { flex: 0 0 auto; }
    .row.refine select, .row.refine .ghost { flex: 1 1 140px; }
  }
</style>
</head>
<body>
<header>
  <h1>SHU<span>N</span>T</h1>
  <nav>
    <a href="/">Painel</a>
    <a href="/requests" aria-current="page">Requisições</a>
  </nav>
  <span id="count"></span>
</header>

<form id="filters" autocomplete="off">
  <div class="row ask">
  <input type="search" id="text" name="text" placeholder="id, modelo, provedor, ferramenta, motivo da falha">
  <div class="chips">
    <button type="button" class="chip bad" data-filter="status_min" data-value="400" aria-pressed="false">falhas</button>
    <button type="button" class="chip" data-filter="stream" data-value="true" aria-pressed="false">stream</button>
    <button type="button" class="chip chain" data-filter="fell_back" data-value="true" aria-pressed="false">com fallback</button>
    <button type="button" class="chip" data-filter="has_tools" data-value="true" aria-pressed="false">usou ferramenta</button>
    <button type="button" class="chip slow" data-filter="min_duration_ms" data-value="5000" aria-pressed="false">&gt; 5 s</button>
  </div>
  </div>
  <div class="row refine">
  <select id="period" aria-label="período">
    <option value="">período: tudo</option>
    <option value="0.25">últimos 15 min</option>
    <option value="1">última hora</option>
    <option value="6">últimas 6 h</option>
    <option value="24">últimas 24 h</option>
    <option value="168">últimos 7 dias</option>
    <option value="custom">entre duas datas…</option>
  </select>
  <span id="range" class="range" hidden>
    <input type="datetime-local" id="since" aria-label="de" step="60">
    <input type="datetime-local" id="until" aria-label="até" step="60">
  </span>
  <select id="requested_model" name="requested_model" aria-label="modelo pedido">
    <option value="">modelo pedido: todos</option>
  </select>
  <select id="candidate_model" name="candidate_model" aria-label="modelo que respondeu">
    <option value="">modelo que respondeu: todos</option>
  </select>
  <select id="provider" name="provider" aria-label="provedor">
    <option value="">provedor: todos</option>
  </select>
  <select id="project" name="project" aria-label="projeto">
    <option value="">projeto: todos</option>
  </select>
  <span class="spacer"></span>
  <button type="button" class="ghost" id="reset">Limpar filtros</button>
  <button type="button" class="ghost" id="export">Exportar CSV</button>
  <select id="analysis-model" aria-label="modelo que lê o período"></select>
  <button type="button" class="ghost" id="analyse">Analisar este período</button>
  </div>
</form>

<main>
  <div class="list">
    <table>
      <thead>
        <tr>
          <th role="button" data-order="time" aria-sort="descending">Quando</th>
          <th class="route">Rota</th>
          <th>Modelo pedido</th>
          <th>Modelo que respondeu</th>
          <th class="project">Projeto</th>
          <th title="streaming, troca de candidato, ferramenta chamada">Sinais</th>
          <th class="n">Tokens</th>
          <th class="n" role="button" data-order="duration">Duração</th>
          <th class="n">Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>Nenhuma requisição com esses filtros.</p>
  </div>
  <aside id="detail" aria-live="polite" hidden></aside>
</main>

<footer>
  <button type="button" class="ghost" id="back" hidden>Página anterior</button>
  <button type="button" class="ghost" id="more" hidden>Carregar mais</button>
  <button type="button" class="ghost" id="top" hidden>Voltar ao início</button>
  <span id="status" role="status"></span>
  <span class="spacer"></span>
</footer>

<script>
const el = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ms = (v) => (v === null || v === undefined ? "—" : v < 1000 ? `${v}ms` : `${(v / 1000).toFixed(1)}s`);
const compact = (n) => {
  if (!n) return "0";
  if (n < 1000) return String(n);
  if (n < 1000000) return `${(n / 1000).toFixed(n < 10000 ? 1 : 0)}k`;
  return `${(n / 1000000).toFixed(1)}M`;
};
const clock = (iso, withSeconds) => {
  const at = new Date(/[Z+]|-\d\d:\d\d$/.test(iso) ? iso : `${iso}Z`);
  if (Number.isNaN(at.getTime())) return "";
  return at.toLocaleTimeString([], {
    hourCycle: "h23",
    hour: "2-digit",
    minute: "2-digit",
    ...(withSeconds ? { second: "2-digit" } : {}),
  });
};
const day = (iso) => {
  const at = new Date(/[Z+]|-\d\d:\d\d$/.test(iso) ? iso : `${iso}Z`);
  return Number.isNaN(at.getTime()) ? "" : at.toLocaleDateString();
};

let state = { order_by: "time" };
// A pilha de cursores é o que permite VOLTAR: keyset não tem endereço de
// página, então quem quer a página anterior precisa ter guardado onde ela
// começou.
let history_cursors = [];
const SELECTS = {
  requested_model: "modelo pedido",
  candidate_model: "modelo que respondeu",
  project: "projeto",
  provider: "provedor",
};

// Os seletores mostram só o que existe no banco: oferecer um provedor que
// nunca respondeu nada é um filtro que só devolve lista vazia.
async function loadFacets() {
  try {
    const response = await fetch("/api/requests/facets");
    if (!response.ok) return;
    const facets = await response.json();
    fill("requested_model", facets.requested_models);
    fill("candidate_model", facets.candidate_models);
    fill("provider", facets.providers);
    fill("project", facets.projects);
  } catch {
    // Sem os seletores a busca por texto continua funcionando.
  }
}

function fill(id, values) {
  const select = el(id);
  const chosen = state[id] || "";
  const options = [`<option value="">${SELECTS[id]}: todos</option>`];
  for (const item of values || []) {
    // O projeto entra pelo último segmento: o caminho inteiro não cabe num
    // seletor, e é ele que fica no `title` para dois projetos homônimos se
    // distinguirem.
    const rotulo = id === "project" ? String(item.value).replace(/\/+$/, "").split("/").pop() : item.value;
    options.push(
      `<option value="${esc(item.value)}" title="${esc(item.value)}">${esc(rotulo)} (${item.count})</option>`
    );
  }
  // Um valor que veio da URL e não está mais no banco continua selecionável,
  // senão abrir um link antigo silenciosamente mudaria a busca.
  if (chosen && !(values || []).some((item) => item.value === chosen)) {
    options.push(`<option value="${esc(chosen)}">${esc(chosen)} (0)</option>`);
  }
  select.innerHTML = options.join("");
  select.value = chosen;
}
let cursor = null;
let loading = false;
let selected = null;

// O estado da busca mora na URL: assim uma investigação é um link que alguém
// manda para outra pessoa, e o botão voltar do navegador funciona.
function readUrl() {
  const params = new URLSearchParams(location.search);
  state = {};
  for (const [key, value] of params) state[key] = value;
  if (!state.order_by) state.order_by = "time";
  el("text").value = state.text || "";
  for (const id of Object.keys(SELECTS)) el(id).value = state[id] || "";
  const hasRange = Boolean(state.since || state.until);
  el("period").value = hasRange ? "custom" : "";
  el("range").hidden = !hasRange;
  el("since").value = state.since ? localValue(state.since) : "";
  el("until").value = state.until ? localValue(state.until) : "";
  for (const chip of document.querySelectorAll(".chip")) {
    const on = state[chip.dataset.filter] === chip.dataset.value;
    chip.setAttribute("aria-pressed", String(on));
  }
  for (const head of document.querySelectorAll("th[data-order]")) {
    if (head.dataset.order === state.order_by) head.setAttribute("aria-sort", "descending");
    else head.removeAttribute("aria-sort");
  }
}

function writeUrl(push) {
  const params = new URLSearchParams();
  for (const [key, value] of Object.entries(state)) {
    if (value !== "" && value !== null && value !== undefined) params.set(key, value);
  }
  const url = `${location.pathname}?${params}`;
  if (push) history.pushState(null, "", url);
  else history.replaceState(null, "", url);
  el("export").dataset.query = params.toString();
}

async function search({ append, cursorOverride } = {}) {
  if (loading) return;
  loading = true;
  el("status").textContent = "buscando…";
  const params = new URLSearchParams(state);
  const useCursor = cursorOverride !== undefined ? cursorOverride : append ? cursor : null;
  if (useCursor) params.set("cursor", useCursor);
  try {
    const response = await fetch(`/api/requests?${params}`);
    const page = await response.json();
    if (!response.ok) {
      el("status").textContent = page.error || "não deu para buscar.";
      return;
    }
    cursor = page.next_cursor;
    render(page, append);
  } catch (err) {
    el("status").textContent = `não deu para buscar: ${err}`;
  } finally {
    loading = false;
  }
}

function render(page, append) {
  const rows = el("rows");
  if (!append) rows.innerHTML = "";
  for (const event of page.events) rows.insertAdjacentHTML("beforeend", rowOf(event));
  const shown = rows.children.length;
  el("count").textContent = page.total
    ? `${shown} de ${page.total} requisições`
    : "nenhuma requisição";
  el("empty").hidden = shown > 0;
  el("more").hidden = !cursor;
  el("back").hidden = history_cursors.length === 0;
  el("top").hidden = shown <= 25;
  el("status").textContent = "";
  if (selected) {
    const row = rows.querySelector(`tr[data-id="${CSS.escape(selected)}"]`);
    if (row) row.setAttribute("aria-selected", "true");
  }
}

// Sem candidato há histórias diferentes: o `count_tokens` estimado aqui, o
// catálogo, a cadeia que ninguém atendeu, e o cliente que desistiu.
function servedLabel(event) {
  if (event.status === 499) return "cliente desistiu";
  if ((event.route || "").includes("count_tokens")) return "estimada aqui";
  if ((event.route || "").includes("models")) return "catálogo";
  return "nenhum candidato respondeu";
}

function rowOf(event) {
  const bad = event.status >= 400 || event.status === 499;
  const tokens = event.input_tokens + event.output_tokens;
  const tools = event.tools_called || [];
  const marks = [
    event.stream ? '<span class="mark">stream</span>' : "",
    event.fell_back ? '<span class="mark fell">fallback</span>' : "",
    tools.length
      ? `<span class="mark tool" title="${esc(tools.join(", "))}">${esc(tools[0])}${
          tools.length > 1 ? ` +${tools.length - 1}` : ""
        }</span>`
      : "",
  ].filter(Boolean).join("");
  return `<tr data-id="${esc(event.request_id)}" class="${bad ? "failed" : ""}">
    <td class="when" data-label="Quando" title="${esc(day(event.started_at))}">${esc(
      clock(event.started_at, true)
    )}</td>
    <td class="route" data-label="Rota">${esc((event.route || "").replace("/v1/", ""))}</td>
    <td data-label="Pedido">${esc(event.requested_model || "—")}</td>
    <td data-label="Respondeu">${bad && event.error_type
      ? `<span class="tag bad" data-label="Respondeu">${esc(event.error_type)}</span>`
      : event.candidate_model
        ? esc(event.candidate_model)
        : `<span class="tag">${esc(servedLabel(event))}</span>`}</td>
    <td class="project" data-label="Projeto" title="${esc(event.project || "")}">${
      event.project ? esc(String(event.project).replace(/\/+$/, "").split("/").pop()) : "—"
    }</td>
    <td class="signals" data-label="Sinais">${marks || '<span class="none">—</span>'}</td>
    <td class="n" data-label="Tokens">${compact(tokens)}</td>
    <td class="n" data-label="Duração">${ms(event.duration_ms)}</td>
    <td class="n status ${bad ? "bad" : ""}" data-label="Status">${event.status}</td>
  </tr>`;
}

function showDetail() {
  el("detail").hidden = false;
  document.querySelector("main").classList.add("with-detail");
  // No telefone o painel empilha ABAIXO da tabela: sem rolar até ele, clicar
  // não parece ter feito nada. Medido num print de 390px — a análise abriu
  // fora da tela.
  revealDetail();
}

// Rolar uma vez não basta: o painel abre com "Analisando…" e cresce quando o
// texto chega, e o conteúdo novo empurra a posição para onde já se rolou.
// Medido a 390px: depois da primeira rolagem o topo do painel ficava a 746px.
function revealDetail() {
  if (window.innerWidth > 900) return;
  el("detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeDetail() {
  selected = null;
  el("detail").hidden = true;
  el("detail").innerHTML = "";
  document.querySelector("main").classList.remove("with-detail");
  for (const row of document.querySelectorAll("#rows tr")) row.setAttribute("aria-selected", "false");
}

async function openDetail(requestId) {
  selected = requestId;
  showDetail();
  for (const row of document.querySelectorAll("#rows tr")) {
    row.setAttribute("aria-selected", String(row.dataset.id === requestId));
  }
  el("detail").innerHTML = `<p class="empty loading" role="status">Carregando…</p>`;
  const response = await fetch(`/api/requests/${encodeURIComponent(requestId)}`);
  const event = await response.json();
  if (!response.ok) {
    el("detail").innerHTML = `<p class="empty">${esc(event.error || "não encontrada")}</p>`;
    return;
  }
  el("detail").innerHTML = detailOf(event);
  wireTabs(event.request_id);
  revealDetail();
}

// A conversa é buscada só quando alguém pede: ela pode ter dezenas de
// milhares de caracteres, e a maioria das visitas ao detalhe quer a cadeia.
const talkCache = new Map();

async function loadTalk(requestId) {
  const target = el("talk");
  if (!target) return;
  if (talkCache.has(requestId)) {
    renderTalk(talkCache.get(requestId));
    return;
  }
  target.innerHTML = `<p class="empty loading" role="status">Carregando…</p>`;
  const response = await fetch(`/api/requests/${encodeURIComponent(requestId)}/body`);
  const body = await response.json();
  if (!response.ok) {
    target.innerHTML = `<p class="empty">${esc(body.error || "sem conversa gravada")}<br><br>
      Ligue com <code>SHUNT_STORE_BODIES=1</code> para gravar as próximas.</p>`;
    return;
  }
  talkCache.set(requestId, body);
  renderTalk(body);
}

// O corpo cru responde outra pergunta: como reproduzir esta requisição. O
// texto diz o que foi dito; isto diz com que parâmetros e com quais
// ferramentas declaradas.
async function loadRaw(requestId) {
  const target = el("raw");
  if (!target) return;
  if (!talkCache.has(requestId)) {
    target.innerHTML = `<p class="empty loading" role="status">Carregando…</p>`;
    const response = await fetch(`/api/requests/${encodeURIComponent(requestId)}/body`);
    const body = await response.json();
    if (!response.ok) {
      target.innerHTML = `<p class="empty">${esc(body.error || "sem corpo gravado")}</p>`;
      return;
    }
    talkCache.set(requestId, body);
  }
  const body = talkCache.get(requestId);
  if (!body.request_json) {
    target.innerHTML = `<p class="empty">O corpo cru não foi gravado para esta requisição.</p>`;
    return;
  }
  target.innerHTML = `
    <div class="body-bar">
      <button type="button" class="ghost" id="copy-raw">Copiar JSON</button>
      <button type="button" class="ghost" id="copy-curl">Copiar como curl</button>
    </div>
    <div class="turn"><pre>${esc(body.request_json)}</pre></div>`;
  el("copy-raw").addEventListener("click", () => copyTo("copy-raw", body.request_json));
  el("copy-curl").addEventListener("click", () =>
    copyTo(
      "copy-curl",
      [
        `curl -X POST ${location.origin}/v1/messages \\`,
        `  -H 'content-type: application/json' \\`,
        `  -H "x-api-key: $SUA_CHAVE" \\`,
        `  -d '${body.request_json.replace(/'/g, "'\\''")}'`,
      ].join("\n")
    )
  );
}

async function copyTo(id, text) {
  await navigator.clipboard?.writeText(text);
  const button = el(id);
  const antes = button.textContent;
  button.textContent = "Copiado";
  setTimeout(() => (button.textContent = antes), 1500);
}

function renderTalk(body) {
  const needle = (el("in-talk")?.value || "").trim();
  const cut = body.truncated
    ? `<span class="cut">cortado: ${compact(body.prompt.length)} de ${compact(body.prompt_bytes)} caracteres no pedido</span>`
    : "";
  el("talk").innerHTML = `
    <div class="body-bar">
      <input type="search" id="in-talk" placeholder="procurar nesta conversa" value="${esc(needle)}">
      <button type="button" class="ghost" id="copy-talk">Copiar</button>
      ${cut}
    </div>
    <div class="talk">
      ${turnsOf(body.prompt, needle)}
      ${turnOf("resposta", body.answer, needle, "assistant")}
    </div>`;
  el("in-talk").addEventListener("input", () => renderTalk(body));
  el("in-talk").focus({ preventScroll: true });
  el("copy-talk").addEventListener("click", async () => {
    await navigator.clipboard?.writeText(`${body.prompt}\n\n---\n\n${body.answer}`);
    el("copy-talk").textContent = "Copiado";
    setTimeout(() => (el("copy-talk").textContent = "Copiar"), 1500);
  });
}

// O texto guardado é "papel: conteúdo", um turno por vez. Separar por linha em
// branco quebrava cada parágrafo num turno próprio: medido numa conversa real,
// 142 blocos, quase todos rotulados "texto". O corte acontece só onde começa um
// papel conhecido no início de uma linha.
const TURN_START = /^(system|user|assistant|tool):\s?/;

function turnsOf(prompt, needle) {
  if (!prompt) return `<p class="empty">Nada no pedido.</p>`;
  const turns = [];
  for (const line of prompt.split("\n")) {
    const match = line.match(TURN_START);
    if (match) turns.push({ who: match[1], text: line.slice(match[0].length) });
    else if (turns.length) turns[turns.length - 1].text += `\n${line}`;
    else turns.push({ who: "", text: line });
  }
  return turns
    .filter((turn) => turn.who || turn.text.trim())
    .map((turn) => turnOf(turn.who, turn.text.trim(), needle))
    .join("");
}

function turnOf(who, text, needle, kindOverride) {
  if (!text && !who) return "";
  const kind = kindOverride || (["system", "user", "assistant", "tool"].includes(who) ? who : "");
  const long = text.length > 1200;
  return `<div class="turn ${kind}">
    <div class="who"><b>${esc(who || "texto")}</b><span>${compact(text.length)} caracteres</span></div>
    <pre>${highlight(text, needle)}</pre>
    ${long ? '<button type="button" class="more">mostrar tudo</button>' : ""}
  </div>`;
}

function highlight(text, needle) {
  const safe = esc(text);
  if (!needle) return safe;
  const pattern = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return safe.replace(pattern, (hit) => `<mark>${hit}</mark>`);
}

function wireTabs(requestId) {
  const tabs = el("detail").querySelectorAll(".tabs button");
  for (const tab of tabs) {
    tab.addEventListener("click", () => {
      for (const other of tabs) other.setAttribute("aria-selected", String(other === tab));
      el("summary").hidden = tab.dataset.tab !== "summary";
      el("talk").hidden = tab.dataset.tab !== "talk";
      el("raw").hidden = tab.dataset.tab !== "raw";
      if (tab.dataset.tab === "talk") loadTalk(requestId);
      if (tab.dataset.tab === "raw") loadRaw(requestId);
    });
  }
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && selected) closeDetail();
});

el("detail").addEventListener("click", (event) => {
  if (event.target.closest("#close-detail")) {
    closeDetail();
    return;
  }
  const button = event.target.closest(".more");
  if (!button) return;
  const turn = button.closest(".turn");
  const open = turn.classList.toggle("open");
  button.textContent = open ? "mostrar menos" : "mostrar tudo";
});

function detailOf(event) {
  const tokens = event.input_tokens + event.output_tokens;
  // A cadeia como aconteceu: cada tentativa que falhou, e no fim quem
  // respondeu. É a pergunta que traz alguém a esta tela.
  const attempts = (event.attempts || []).map((line) => {
    const [who, ...rest] = String(line).split(":");
    return `<li><b>${esc(who)}</b> <small>${esc(rest.join(":").trim())}</small></li>`;
  });
  if (event.candidate_model) {
    attempts.push(
      `<li class="won"><b>${esc(event.candidate_model)}</b> <small>respondeu em ${ms(event.duration_ms)}</small></li>`
    );
  }
  const called = event.tools_called || [];
  const offered = (event.tools_offered || []).filter((tool) => !called.includes(tool));
  const pills = called.map((tool) => `<span class="pill used">${esc(tool)}</span>`).join("");
  const rest = offered.length
    ? `<details class="rest">
         <summary>${offered.length} oferecidas e não chamadas</summary>
         <div class="pills">${offered
           .map((tool) => `<span class="pill">${esc(tool)}</span>`)
           .join("")}</div>
       </details>`
    : "";
  return `
    <div class="detail-head">
      <h2>${esc(event.candidate_model || servedLabel(event))}</h2>
      <button type="button" class="ghost" id="close-detail">Fechar</button>
    </div>
    <p class="id">${esc(event.request_id)}</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="summary" aria-selected="true">Resumo</button>
      <button type="button" role="tab" data-tab="talk" aria-selected="false">Conversa</button>
      <button type="button" role="tab" data-tab="raw" aria-selected="false">Requisição</button>
    </div>
    <div id="raw" hidden></div>
    <div id="talk" hidden></div>
    <div id="summary">
    <dl>
      <dt>Quando</dt><dd>${esc(day(event.started_at))} ${esc(clock(event.started_at, true))}</dd>
      <dt>Rota</dt><dd>${esc(event.route)} · ${esc(event.dialect)}${event.stream ? " · stream" : ""}</dd>
      <dt>Modelo pedido</dt><dd>${esc(event.requested_model || "—")}</dd>
      <dt>Regra de rota</dt><dd>${esc(event.rule)}${event.matched ? ` → ${esc(event.matched)}` : ""}</dd>
      <dt>Provedor</dt><dd>${esc(event.provider || "—")}</dd>
      <dt>Projeto</dt><dd title="${esc(event.project || "")}">${esc(event.project || "—")}</dd>
      <dt>Status</dt><dd>${event.status}${event.error_type ? ` · ${esc(event.error_type)}` : ""}</dd>
      <dt>Tokens</dt><dd>${compact(event.input_tokens)} entrada · ${compact(event.output_tokens)} saída · ${compact(tokens)} total</dd>
      <dt>Duração</dt><dd>${ms(event.duration_ms)}${event.ttft_ms !== null ? ` · 1º token ${ms(event.ttft_ms)}` : ""}</dd>
      <dt>Raciocínio</dt><dd>${event.thinking_blocks} bloco(s)</dd>
    </dl>
    <h3>Cadeia</h3>
    <ul class="chain">${attempts.join("") || '<li class="won"><b>sem tentativas registradas</b></li>'}</ul>
    <h3>Ferramentas</h3>
    ${called.length ? `<div class="pills">${pills}</div>` : '<p class="empty">Nenhuma chamada.</p>'}
    ${rest}
    </div>
  `;
}

// A análise do período usa o painel lateral do detalhe: é a mesma pergunta
// ("o que está acontecendo aqui"), só que sobre o recorte inteiro em vez de
// sobre uma linha. Abrir uma segunda área ao lado espremeria a tabela.
let analysis = null;

// O catálogo vem da própria rota da análise: `/v1/models` grava uma linha no
// histórico a cada visita, e a tela passaria a sujar o período que analisa.
async function loadAnalysisModels() {
  try {
    const response = await fetch("/api/analysis");
    if (!response.ok) return;
    const data = await response.json();
    const select = el("analysis-model");
    const escolhas = data.models || [];
    select.innerHTML = escolhas
      .map((name) => `<option value="${esc(name)}"${name === data.default_model ? " selected" : ""}>${esc(name)}</option>`)
      .join("");
    select.hidden = escolhas.length === 0;
  } catch (err) {
    /* sem banco ou sem rede: o botão ainda funciona e o erro aparece no painel */
  }
}

// O modelo responde em Markdown, e mostrar o Markdown cru ("**1. Reduzir…**",
// crase em volta de cada número) faz a leitura parecer um log. Isto cobre o
// subconjunto que uma análise usa: título, negrito, itálico, código e lista.
// A escapada vem PRIMEIRO -- o texto vem de um modelo, e é conteúdo, não HTML.
function markdownLite(texto) {
  const linhas = esc(texto || "").split("\n");
  const saida = [];
  let lista = false;
  for (const bruta of linhas) {
    const linha = bruta.trimEnd();
    // Só marcador de bala vira lista. Recomendação numerada fica parágrafo COM
    // o número: ele é a ordem por impacto que o prompt pediu, e uma <ol> o
    // reescreveria a partir de 1 -- inclusive quando o modelo pula um número.
    const item = linha.match(/^\s*(?:[-•]|\*(?!\*))\s+(.*)$/);
    if (item) {
      if (!lista) { saida.push("<ul>"); lista = true; }
      saida.push(`<li>${inline(item[1])}</li>`);
      continue;
    }
    if (lista) { saida.push("</ul>"); lista = false; }
    const titulo = linha.match(/^\s*(#{1,4})\s+(.*)$/);
    if (titulo) {
      saida.push(`<h4>${inline(titulo[2])}</h4>`);
      continue;
    }
    if (!linha.trim()) continue;
    saida.push(`<p>${inline(linha)}</p>`);
  }
  if (lista) saida.push("</ul>");
  return saida.join("");
}

function inline(texto) {
  return texto
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:]|$)/g, "$1<i>$2</i>");
}

function analysisOf(item) {
  const spent = item.cached
    ? "reaproveitada — não custou tokens agora"
    : `${compact(item.input_tokens || 0)} entrada · ${compact(item.output_tokens || 0)} saída · ${ms(item.duration_ms)}`;
  const dossier = JSON.stringify(item.dossier || {}, null, 2);
  const requests = item.dossier?.volume?.requests ?? 0;
  const sampled = item.dossier?.volume?.sampled
    ? `<p class="empty">O período tem ${compact(requests)} requisições e a análise leu ${compact(item.dossier.volume.rows_read)}: os números descrevem uma amostra.</p>`
    : "";
  return `
    <div class="detail-head">
      <h2>Análise do período</h2>
      <button type="button" class="ghost" id="close-detail">Fechar</button>
    </div>
    <p class="id">${esc(item.candidate_model || item.requested_model || "")} · ${esc(spent)}</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="analysis" aria-selected="true">Leitura</button>
      <button type="button" role="tab" data-tab="dossier" aria-selected="false">Dossiê</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="reanalyse">Refazer</button>
    </div>
    <div id="analysis-text">
      ${sampled}
      <div class="read">${markdownLite(item.text)}</div>
    </div>
    <div id="analysis-dossier" hidden>
      <p class="empty">Os números que a leitura acima tem de citar. ${compact(requests)} requisições no recorte.</p>
      <pre class="raw">${esc(dossier)}</pre>
    </div>
  `;
}

function wireAnalysis() {
  const tabs = el("detail").querySelectorAll(".tabs button");
  for (const tab of tabs) {
    tab.addEventListener("click", () => {
      for (const other of tabs) other.setAttribute("aria-selected", String(other === tab));
      el("analysis-text").hidden = tab.dataset.tab !== "analysis";
      el("analysis-dossier").hidden = tab.dataset.tab !== "dossier";
    });
  }
  el("close-detail")?.addEventListener("click", closeDetail);
  el("reanalyse")?.addEventListener("click", () => analysePeriod({ refresh: true }));
}

async function analysePeriod({ refresh } = {}) {
  selected = null;
  showDetail();
  el("detail").innerHTML = `<p class="empty loading" role="status">Analisando o período…
    isso chama um modelo pelo próprio proxy, e custa tokens.</p>`;
  const params = new URLSearchParams();
  for (const [key, value] of Object.entries(state)) {
    if (key !== "order_by" && value !== "" && value !== null && value !== undefined) {
      params.set(key, value);
    }
  }
  try {
    const response = await fetch(`/api/analysis?${params}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        refresh: Boolean(refresh),
        model: el("analysis-model").value || undefined,
      }),
    });
    const item = await response.json();
    if (!response.ok) {
      el("detail").innerHTML = `
        <div class="detail-head">
          <h2>Análise do período</h2>
          <button type="button" class="ghost" id="close-detail">Fechar</button>
        </div>
        <p class="empty">${esc(item.error || "não deu para analisar")}</p>`;
      el("close-detail")?.addEventListener("click", closeDetail);
      return;
    }
    analysis = item;
    el("detail").innerHTML = analysisOf(item);
    wireAnalysis();
    revealDetail();
  } catch (err) {
    el("detail").innerHTML = `<p class="empty">não deu para analisar: ${esc(err)}</p>`;
  }
}

el("analyse").addEventListener("click", () => analysePeriod());

function periodToState(choice) {
  delete state.since;
  delete state.until;
  el("range").hidden = choice !== "custom";
  if (!choice || choice === "custom") return;
  // Vira instante, e não "últimas N horas": um link mandado meia hora depois
  // tem de mostrar a mesma janela que o autor viu.
  const since = new Date(Date.now() - Number(choice) * 3600 * 1000);
  state.since = since.toISOString();
}

function localValue(iso) {
  const at = new Date(iso);
  if (Number.isNaN(at.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${at.getFullYear()}-${pad(at.getMonth() + 1)}-${pad(at.getDate())}T${pad(at.getHours())}:${pad(at.getMinutes())}`;
}

function update(push = true) {
  cursor = null;
  history_cursors = [];
  writeUrl(push);
  search();
}

el("filters").addEventListener("submit", (event) => event.preventDefault());

for (const chip of document.querySelectorAll(".chip")) {
  chip.addEventListener("click", () => {
    const on = chip.getAttribute("aria-pressed") === "true";
    chip.setAttribute("aria-pressed", String(!on));
    if (on) delete state[chip.dataset.filter];
    else state[chip.dataset.filter] = chip.dataset.value;
    update();
  });
}

let typing = null;
el("text").addEventListener("input", (event) => {
  clearTimeout(typing);
  // Espera a pessoa parar de digitar: uma consulta por tecla transformaria a
  // busca numa rajada contra o mesmo banco que o proxy está gravando.
  typing = setTimeout(() => {
    const value = event.target.value.trim();
    if (value) state.text = value;
    else delete state.text;
    update(false);
  }, 300);
});

el("period").addEventListener("change", (event) => {
  periodToState(event.target.value);
  update();
});

for (const id of ["since", "until"]) {
  el(id).addEventListener("change", (event) => {
    const value = event.target.value;
    if (value) state[id] = new Date(value).toISOString();
    else delete state[id];
    update();
  });
}

for (const id of Object.keys(SELECTS)) {
  el(id).addEventListener("change", (event) => {
    const value = event.target.value;
    if (value) state[id] = value;
    else delete state[id];
    update();
  });
}

for (const head of document.querySelectorAll("th[data-order]")) {
  head.addEventListener("click", () => {
    state.order_by = head.dataset.order;
    update();
  });
}

el("rows").addEventListener("click", (event) => {
  const row = event.target.closest("tr");
  if (row?.dataset.id) openDetail(row.dataset.id);
});

// O download passa por `fetch` para ler o cabeçalho que diz se o resultado saiu
// inteiro: um CSV cortado em silêncio vira uma conclusão errada numa planilha.
el("export").addEventListener("click", async () => {
  const query = el("export").dataset.query || "";
  el("status").textContent = "exportando…";
  try {
    const response = await fetch(`/api/requests/export?${query}`);
    if (!response.ok) {
      el("status").textContent = "não deu para exportar.";
      return;
    }
    const cut = response.headers.get("x-shunt-truncated") === "1";
    const exported = response.headers.get("x-shunt-exported");
    const total = response.headers.get("x-shunt-total");
    const blob = await response.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `shunt-requests-${new Date().toISOString().slice(0, 19)}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
    el("status").textContent = cut
      ? `exportadas ${exported} de ${total} — o arquivo está cortado.`
      : `exportadas ${exported} requisições.`;
  } catch (err) {
    el("status").textContent = `não deu para exportar: ${err}`;
  }
});

el("more").addEventListener("click", () => {
  if (cursor) history_cursors.push(cursor);
  search({ append: true });
});

el("back").addEventListener("click", () => {
  // Uma página para trás é redesenhar até o cursor anterior: keyset não anda
  // ao contrário, e fingir que anda daria uma lista diferente da que a pessoa
  // acabou de ver.
  history_cursors.pop();
  const target = history_cursors.length ? history_cursors[history_cursors.length - 1] : null;
  cursor = null;
  search({ cursorOverride: target });
});

el("top").addEventListener("click", () => {
  history_cursors = [];
  cursor = null;
  window.scrollTo({ top: 0, behavior: "smooth" });
  search();
});

el("reset").addEventListener("click", () => {
  state = { order_by: "time" };
  readUrlFromState();
  update();
});

function readUrlFromState() {
  el("text").value = "";
  el("period").value = "";
  el("range").hidden = true;
  el("since").value = "";
  el("until").value = "";
  for (const id of Object.keys(SELECTS)) el(id).value = "";
  for (const chip of document.querySelectorAll(".chip")) chip.setAttribute("aria-pressed", "false");
}

window.addEventListener("popstate", () => {
  readUrl();
  cursor = null;
  search();
});

readUrl();
writeUrl(false);
search();
loadFacets();
loadAnalysisModels();
</script>
</body>
