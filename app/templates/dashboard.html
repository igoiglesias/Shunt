<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shunt</title>
<style>
  :root {
    --ground: #0e1620;
    --panel: #16202c;
    --panel-edge: #23303f;
    --ink: #e6eaf0;
    --muted: #8a99ac;
    --dim: #5b6b7e;
    --requests: #5bc8c4;
    --tokens: #e8a33d;
    --fallback: #9b8cf0;
    --error: #e4574c;
    --num: ui-monospace, "SF Mono", "JetBrains Mono", "DejaVu Sans Mono", monospace;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.5 var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }

  /* Barra de estado: uma linha, como o mostrador de um instrumento. */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 22px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--panel-edge);
    background: linear-gradient(180deg, #16202c, #111a24);
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  header h1 span { color: var(--requests); }
  header nav { display: flex; gap: 16px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a[aria-current="page"] { color: var(--ink); border-bottom: 2px solid var(--requests); }
  .state { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .state div:first-child { color: var(--muted); }
  .state b { color: var(--ink); font-weight: 500; }
  .lamp { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .lamp.on { background: var(--requests); box-shadow: 0 0 8px var(--requests); }
  .lamp.off { background: var(--dim); }
  .lamp.warn { background: var(--tokens); box-shadow: 0 0 8px var(--tokens); }
  .windows { margin-left: auto; display: flex; gap: 2px; }
  .windows button {
    font: inherit;
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .windows button[aria-pressed="true"] { color: var(--ground); background: var(--requests); }
  .windows button:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }

  main { padding: 20px; display: grid; gap: 20px; }
  .flow-band {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 20px;
    align-items: stretch;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    padding: 14px 16px 16px;
    min-width: 0;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
  }
  h2 em { font-style: normal; color: var(--dim); font-weight: 400; }

  .figures { display: flex; flex-wrap: wrap; gap: 14px 34px; align-items: flex-start; }
  .group + .group { border-left: 1px solid var(--panel-edge); padding-left: 34px; }
  .group h3 { margin: 0 0 8px; font-size: 11.5px; font-weight: 500; color: var(--dim); }
  .group-figures { display: flex; flex-wrap: wrap; gap: 22px; }
  .figure .value { font-family: var(--num); font-size: 24px; line-height: 1.1; }
  .figure .label { font-size: 12px; color: var(--muted); }
  .figure.requests .value { color: var(--requests); }
  .figure.tokens .value { color: var(--tokens); }
  .figure.fallback .value { color: var(--fallback); }
  .figure.errors .value { color: var(--error); }

  .scroll { overflow-x: auto; }
  .scroll table { min-width: 380px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 5px 8px 5px 0; text-align: left; border-bottom: 1px solid #1d2835; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  .bar { position: relative; padding-left: 9px; }
  .bar span {
    position: absolute;
    inset: 2px auto 2px 0;
    background: rgba(91, 200, 196, 0.14);
    border-left: 3px solid var(--requests);
    border-radius: 0 2px 2px 0;
    z-index: 0;
  }
  .bar b { position: relative; font-weight: 400; }

  .tape { max-height: 340px; overflow-y: auto; }
  h2 .toggle {
    float: right;
    font: inherit;
    font-size: 11.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 1px 8px;
    cursor: pointer;
  }
  h2 .toggle[aria-pressed="true"] { color: var(--ground); background: var(--error); border-color: var(--error); }
  h2 .toggle:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }
  .tape li.bad { background: rgba(228, 87, 76, 0.08); }
  .tape li {
    display: grid;
    grid-template-columns: 9ch minmax(0, 1fr) 13ch;
    gap: 14px;
    padding: 5px 0;
    border-bottom: 1px solid #1d2835;
    font-size: 12.5px;
    align-items: baseline;
  }
  .tape ul { list-style: none; margin: 0; padding: 0; }
  .tape li[hidden] { display: none; }
  .tape .when { color: var(--dim); font-family: var(--num); }
  .tape .what b { font-weight: 500; margin-right: 6px; }
  .tape .what { min-width: 0; overflow-wrap: anywhere; }
  .tape .what small { color: var(--muted); }
  .tape .cost { font-family: var(--num); color: var(--muted); text-align: right; }
  .tape li.bad .what b { color: var(--error); }
  .tape li.fell .what b { color: var(--fallback); }
  .tape li.fresh { animation: land 900ms ease-out; }
  @keyframes land {
    from { background: rgba(91, 200, 196, 0.14); }
    to { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tape li.fresh { animation: none; }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
    gap: 20px;
  }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 0; }
  /* Janela sem tráfego: uma faixa que explica e oferece a saída vale mais do
     que sete painéis repetindo "nada aqui" em alturas de tela cheia. */
  #nothing {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  #nothing[hidden] { display: none; }
  .nothing-said { margin: 0; color: var(--muted); }
  .ghost {
    font: inherit;
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 4px 11px;
    cursor: pointer;
  }
  .ghost:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }
  main.idle .flow-band,
  main.idle > section:not(#nothing),
  main.idle .grid { display: none; }
  svg { display: block; width: 100%; height: auto; }
  .axis { fill: var(--dim); font-size: 10px; font-family: var(--num); }
  .legend { display: flex; gap: 16px; margin: 6px 0 0; font-size: 11.5px; color: var(--muted); }
  .key::before {
    content: "";
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 6px;
  }
  .key.req::before { background: var(--requests); }
  .key.tok::before { background: var(--tokens); border-radius: 50%; }
  .key.err::before { background: var(--error); border-radius: 50%; }
  .flow-label { fill: var(--ink); font-size: 12px; }
  .flow-sub { fill: var(--muted); font-size: 10.5px; font-family: var(--num); }
  footer {
    padding: 0 20px 26px;
    color: var(--dim);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .danger {
    font: inherit;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .danger[data-armed="true"] { color: var(--ground); background: var(--error); border-color: var(--error); }
  .danger:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }
  .danger[disabled] { opacity: 0.5; cursor: default; }
  #clear-said { color: var(--muted); }

  @media (max-width: 860px) {
    .flow-band { grid-template-columns: 1fr; }
    .windows { margin-left: 0; width: 100%; }
    /* O SVG encolhe junto com a tela, e com ele o texto dentro do viewBox.
       Medido em 390 px: rotulo de 12 px virava 6 px, ilegivel. O diagrama
       compensa no proprio desenho (ver `drawFlow`); a serie so precisa do
       texto maior. */
    #series .axis { font-size: 26px; }
  }
</style>
</head>
<body>
<header>
  <h1>SHU<span>N</span>T</h1>
  <nav>
    <a href="/" aria-current="page">Painel</a>
    <a href="/requests">Requisições</a>
  </nav>
  <div class="state" id="state"></div>
  <div class="windows" id="windows">
    <button data-hours="0.0833" aria-pressed="false">5min</button>
    <button data-hours="1" aria-pressed="false">1h</button>
    <button data-hours="24" aria-pressed="true">24h</button>
    <button data-hours="168" aria-pressed="false">7d</button>
  </div>
</header>

<main>
  <section id="nothing" hidden>
    <p class="nothing-said"></p>
    <button type="button" class="ghost" id="widen">Ver as últimas 24 h</button>
  </section>
  <div class="flow-band">
    <section>
      <h2>Modelo pedido e quem respondeu <em>largura = requisições</em></h2>
      <div id="flow"></div>
    </section>
    <section class="tape">
      <h2>
        Chegando agora
        <button type="button" id="only-errors" class="toggle" aria-pressed="false">só erros</button>
      </h2>
      <ul id="tape"></ul>
      <p class="empty" id="tape-empty" hidden>Nenhuma falha nesta lista.</p>
    </section>
  </div>

  <section>
    <h2>Resumo da janela</h2>
    <div class="figures" id="figures"></div>
  </section>

  <section>
    <h2>Requisições e tokens por hora</h2>
    <div id="series"></div>
  </section>

  <div class="grid">
    <section><h2>Modelo que respondeu</h2><div id="models"></div></section>
    <section><h2>Provedor</h2><div id="providers"></div></section>
    <section><h2>Rota <em>sob /v1</em></h2><div id="routes"></div></section>
    <section><h2>Cadeia de fallback</h2><div id="chain"></div></section>
    <section><h2>Ferramentas</h2><div id="tools"></div></section>
    <section><h2>Erros</h2><div id="errors"></div></section>
  </div>
</main>

<footer>
  <span id="footer"></span>
  <button type="button" id="clear" class="danger">Limpar histórico</button>
  <span id="clear-said" role="status"></span>
</footer>

<script>
const REFRESH_MS = 15000;
let hours = 24;
let snapshot = null;

const el = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const compact = (n) => {
  if (n === null || n === undefined) return "—";
  if (n < 1000) return String(n);
  if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + "k";
  return (n / 1000000).toFixed(1) + "M";
};
// O banco guarda UTC; quem le o painel vive em outro fuso. Um balde por hora
// vem como "2026-09-19T08:00" sem offset, e sem o "Z" o navegador o leria como
// hora local -- deslocando o gráfico inteiro.
const clock = (iso, withSeconds) => {
  const at = new Date(/[Z+]|[-]\d\d:\d\d$/.test(iso) ? iso : `${iso}Z`);
  if (Number.isNaN(at.getTime())) return "";
  return at.toLocaleTimeString([], {
    hourCycle: "h23",
    hour: "2-digit",
    minute: "2-digit",
    ...(withSeconds ? { second: "2-digit" } : {}),
  });
};
const ms = (v) => (v === null || v === undefined ? "—" : v < 1000 ? v + "ms" : (v / 1000).toFixed(1) + "s");
const pct = (v) => (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%";

async function load() {
  const response = await fetch(`/api/stats?window=${hours}`);
  const fresh = await response.json();
  // `make prod` sobe um worker por núcleo, e cada um tem o seu banco aberto.
  // Um worker que não conseguiu abrir o seu responde um resumo zerado, e a
  // atualização seguinte caía nele e apagava a tela inteira por alguns
  // segundos. Resumo vazio de um banco que existe não substitui o que já está
  // desenhado: só o estado do cabeçalho muda, para que a reconexão apareça.
  const emptyFromABrokenWorker =
    fresh.health && !fresh.health.enabled && fresh.health.configured;
  const hadData = snapshot && snapshot.totals && snapshot.totals.requests > 0;
  if (emptyFromABrokenWorker && hadData && fresh.totals.requests === 0) {
    snapshot = { ...snapshot, health: fresh.health };
    drawState();
    return;
  }
  snapshot = fresh;
  draw();
}

function draw() {
  // Janela vazia: uma faixa com a saída, em vez de sete painéis vazios.
  const idle = (snapshot.totals?.requests ?? 0) === 0;
  document.querySelector("main").classList.toggle("idle", idle);
  el("nothing").hidden = !idle;
  if (idle) {
    const quando =
      hours < 1 ? `nos últimos ${Math.round(hours * 60)} min` : `nas últimas ${hours} h`;
    el("nothing").querySelector(".nothing-said").textContent = snapshot.health?.enabled
      ? `Nenhuma requisição ${quando}.`
      : `Nenhuma requisição ${quando}, e a persistência está desligada.`;
    el("widen").hidden = hours >= 24;
    drawState();
    return;
  }
  drawState();
  drawFigures();
  drawFlow();
  drawSeries();
  drawTable("models", snapshot.by_model, "model", "Modelo");
  drawTable("providers", snapshot.by_provider, "provider", "Provedor");
  drawTable("routes", snapshot.by_route.map((r) => ({ ...r, route: r.route.replace(/^\/v1\//, "") })), "route", "Rota em /v1");
  drawChain();
  drawTools();
  drawErrors();
  mergeTape();
}

function drawState() {
  const health = snapshot.health;
  const on = health.enabled;
  const waiting = !on && health.configured;
  const lamp = on ? "on" : waiting ? "warn" : "off";
  const word = on ? "gravando" : waiting ? "reconectando" : "sem banco";
  el("state").innerHTML = `
    <div><span class="lamp ${lamp}"></span>${word}</div>
    <div>fila <b class="num">${health.queued}</b></div>
    <div>descartes <b class="num">${health.dropped}</b></div>
    <div>falhas <b class="num">${health.failures}</b></div>
    <div>lotes <b class="num">${health.commits}</b></div>`;
  el("clear").disabled = !on;
  el("footer").textContent = on
    ? `Uma linha por requisição, gravada em lote fora do caminho da API.`
    : waiting
      ? `Banco configurado e fora de alcance neste worker. Ele tenta reabrir a cada 30 s; o painel ao vivo segue funcionando.`
      : `Persistência desligada: defina TURSO_DATABASE_URL para guardar histórico. O painel ao vivo segue funcionando.`;
}

// Oito números em fila pedem que o leitor descubra sozinho quais conversam
// entre si. Em três grupos — volume, latência, saúde — a comparação certa fica
// ao alcance e a errada fica longe.
function drawFigures() {
  const t = snapshot.totals;
  const grupos = [
    [
      "Volume",
      [
        ["requests", compact(t.requests), "requisições"],
        ["tokens", compact(t.input_tokens + t.output_tokens), "tokens"],
        ["", compact(t.input_tokens), "de entrada"],
        ["", compact(t.streams), "em streaming"],
      ],
    ],
    [
      "Latência",
      [
        ["", ms(t.p50_duration_ms), "mediana"],
        ["", ms(t.p95_duration_ms), "p95"],
        ["", ms(t.p50_ttft_ms), "1º token"],
        ["", ms(t.p95_ttft_ms), "1º token p95"],
      ],
    ],
    [
      "Saúde",
      [
        [
          t.error_rate > 0.05 ? "errors" : "",
          t.requests ? pct(t.error_rate) : "—",
          `erros (${t.errors})`,
        ],
        ["fallback", compact(t.fallbacks), "trocas de candidato"],
      ],
    ],
  ];
  el("figures").innerHTML = grupos
    .map(
      ([titulo, figuras]) => `
      <div class="group">
        <h3>${esc(titulo)}</h3>
        <div class="group-figures">
          ${figuras
            .map(
              ([kind, value, label]) =>
                `<div class="figure ${kind}"><div class="value">${esc(value)}</div>
                 <div class="label">${esc(label)}</div></div>`
            )
            .join("")}
        </div>
      </div>`
    )
    .join("");
}

// O diagrama que dá nome ao painel: o que foi PEDIDO à esquerda, o que
// RESPONDEU à direita, e a espessura da faixa é o volume. É a pergunta que
// um proxy de substituição de modelo existe para responder.
// O herói da página. Duas colunas soltas diziam "pediram opus 35 vezes" e "o
// local respondeu 36"; nenhuma das duas dizia se foi o opus que caiu no local.
// A fita entre elas diz, e é a pergunta que um proxy de substituição existe
// para responder.
function drawFlow() {
  const pairs = snapshot.pairs || [];
  if (!pairs.length) {
    el("flow").innerHTML = `<p class="empty">Nenhuma requisição atendida nesta janela.</p>`;
    return;
  }

  const narrow = window.innerWidth <= 860;
  const scale = narrow ? 1.9 : 1;
  const W = 640;
  const ROW = 46 * scale;
  const GAP = 10 * scale;
  const left = 4;
  const right = W - 4;

  // Um nó por modelo de cada lado, com altura proporcional ao volume.
  const side = (key) => {
    const totals = new Map();
    for (const pair of pairs) totals.set(pair[key], (totals.get(pair[key]) || 0) + pair.requests);
    return [...totals.entries()].sort((a, b) => b[1] - a[1]);
  };
  const asked = side("asked");
  const served = side("served");
  const total = pairs.reduce((sum, pair) => sum + pair.requests, 0) || 1;

  const TOP = 40 * scale;
  const LABEL = 22 * scale;
  // A altura vem do conteúdo: uma barra mínima por modelo, o resto repartido
  // pelo volume. Calcular antes é o que garante que o último nó caiba.
  const rows = Math.max(asked.length, served.length);
  const barSpace = Math.max(120, rows * 26 * scale);
  const H = TOP + barSpace + rows * (GAP + LABEL) + 10;

  const place = (list) => {
    const map = new Map();
    let y = TOP;
    for (const [name, count] of list) {
      const height = Math.max(8 * scale, (count / total) * barSpace);
      map.set(name, { y, height, count });
      y += height + GAP + LABEL;
    }
    return map;
  };
  const leftNodes = place(asked);
  const rightNodes = place(served);

  const node = (map, x, anchor, color) =>
    [...map.entries()]
      .map(([name, box]) => {
        const tx = anchor === "end" ? x - 10 : x + 10;
        return `
          <rect x="${anchor === "end" ? x - 5 : x + 1}" y="${box.y.toFixed(1)}" width="4"
                height="${box.height.toFixed(1)}" rx="2" fill="${color}" />
          <text class="flow-label" x="${tx}" y="${(box.y - 6).toFixed(1)}"
                text-anchor="${anchor}" style="font-size:${12 * scale}px">${esc(name)}</text>
          <text class="flow-sub" x="${tx}" y="${(box.y + 10).toFixed(1)}"
                text-anchor="${anchor}" style="font-size:${10.5 * scale}px">${box.count} req</text>`;
      })
      .join("");

  // Cada fita sai do nó pedido e entra no nó que respondeu, empilhando-se
  // dentro de ambos — é isso que deixa ver que um pedido se dividiu.
  const usedLeft = new Map();
  const usedRight = new Map();
  const ribbons = pairs
    .map((pair) => {
      const from = leftNodes.get(pair.asked);
      const to = rightNodes.get(pair.served);
      if (!from || !to) return "";
      const share = pair.requests / total;
      const thickness = Math.max(2, share * barSpace);
      const y1 = from.y + (usedLeft.get(pair.asked) || 0);
      const y2 = to.y + (usedRight.get(pair.served) || 0);
      usedLeft.set(pair.asked, (usedLeft.get(pair.asked) || 0) + thickness);
      usedRight.set(pair.served, (usedRight.get(pair.served) || 0) + thickness);
      const x1 = left + 6;
      const x2 = right - 6;
      const mid = (x1 + x2) / 2;
      const path = [
        `M${x1},${y1.toFixed(1)}`,
        `C${mid},${y1.toFixed(1)} ${mid},${y2.toFixed(1)} ${x2},${y2.toFixed(1)}`,
        `L${x2},${(y2 + thickness).toFixed(1)}`,
        `C${mid},${(y2 + thickness).toFixed(1)} ${mid},${(y1 + thickness).toFixed(1)} ${x1},${(y1 + thickness).toFixed(1)}`,
        "Z",
      ].join(" ");
      const title = `${pair.asked} → ${pair.served}: ${pair.requests} req · ${compact(pair.tokens)} tok`;
      return `<path d="${path}" fill="var(--requests)" opacity="0.14"><title>${esc(title)}</title></path>`;
    })
    .join("");

  el("flow").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Fitas ligando o modelo pedido ao modelo que respondeu">
      <text class="axis" x="${left}" y="12">modelo pedido</text>
      <text class="axis" x="${right}" y="12" text-anchor="end">modelo que respondeu</text>
      ${ribbons}
      ${node(leftNodes, left, "start", "var(--requests)")}
      ${node(rightNodes, right, "end", "var(--tokens)")}
    </svg>`;
}

function drawSeries() {
  const points = snapshot.per_hour;
  if (!points.length) {
    el("series").innerHTML = `<p class="empty">Sem tráfego nesta janela.</p>`;
    return;
  }

  const W = 960, H = 190;
  const padL = 46, padR = 54, padT = 16, padB = 26;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const base = padT + plotH;

  const at = (point) => new Date(`${point.hour}Z`).getTime();
  const tokensOf = (point) => point.input_tokens + point.output_tokens;
  const first = at(points[0]);
  const last = at(points[points.length - 1]);
  const hour = 3600 * 1000;
  // Uma hora só não tem intervalo: abre-se uma hora de cada lado para a barra
  // não ocupar a largura inteira do painel.
  const from = first - hour / 2;
  const to = last + hour / 2;
  const x = (time) => padL + ((time - from) / (to - from)) * plotW;
  const maxRequests = Math.max(...points.map((p) => p.requests), 1);
  const maxTokens = Math.max(...points.map(tokensOf), 1);
  const yR = (v) => base - (v / maxRequests) * plotH;
  const yT = (v) => base - (v / maxTokens) * plotH;
  const barW = Math.max(6, Math.min(34, (plotW / Math.max(points.length, 1)) * 0.5));

  // Três linhas de grade, com o valor de cada eixo na sua própria ponta.
  const grid = [0, 0.5, 1]
    .map((fraction) => {
      const y = base - fraction * plotH;
      return `
        <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"
              stroke="var(--panel-edge)" stroke-dasharray="${fraction ? "2 4" : "0"}" />
        <text class="axis" x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end"
              fill="var(--requests)">${compact(Math.round(maxRequests * fraction))}</text>
        <text class="axis" x="${W - padR + 8}" y="${(y + 3.5).toFixed(1)}"
              fill="var(--tokens)">${compact(Math.round(maxTokens * fraction))}</text>`;
    })
    .join("");

  const bars = points
    .map((point) => {
      const cx = x(at(point));
      const top = yR(point.requests);
      const title = `${clock(point.hour, false)} · ${point.requests} req · ${compact(tokensOf(point))} tok`;
      return `<rect x="${(cx - barW / 2).toFixed(1)}" y="${top.toFixed(1)}"
                    width="${barW.toFixed(1)}" height="${Math.max(1, base - top).toFixed(1)}"
                    rx="2" fill="var(--requests)" opacity="0.85"><title>${esc(title)}</title></rect>`;
    })
    .join("");

  const line =
    points.length > 1
      ? `<path d="${points
          .map((p, i) => `${i ? "L" : "M"}${x(at(p)).toFixed(1)},${yT(tokensOf(p)).toFixed(1)}`)
          .join("")}" fill="none" stroke="var(--tokens)" stroke-width="2" />`
      : "";
  const dots = points
    .map((p) => {
      const cx = x(at(p)).toFixed(1);
      return `<circle cx="${cx}" cy="${yT(tokensOf(p)).toFixed(1)}" r="3.5" fill="var(--tokens)" />`;
    })
    .join("");
  const errors = points
    .filter((p) => p.errors)
    .map(
      (p) =>
        `<circle cx="${x(at(p)).toFixed(1)}" cy="${(yR(p.requests) - 8).toFixed(1)}" r="3.5"
                 fill="var(--error)"><title>${p.errors} com erro</title></circle>`
    )
    .join("");

  // Um rótulo a cada N horas, escolhido pela largura disponível — rótulos
  // sobrepostos são pior do que rótulo nenhum.
  const step = Math.max(1, Math.ceil(points.length / 10));
  const ticks = points
    .filter((_, i) => i % step === 0)
    .map(
      (p) =>
        `<text class="axis" x="${x(at(p)).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(
          clock(p.hour, false)
        )}</text>`
    )
    .join("");

  el("series").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Requisições por hora em barras e tokens por hora em linha">
      ${grid}${bars}${line}${dots}${errors}${ticks}
    </svg>
    <p class="legend">
      <span class="key req">requisições</span>
      <span class="key tok">tokens</span>
      <span class="key err">horas com erro</span>
    </p>`;
}

function drawTable(id, rows, key, heading) {
  if (!rows.length) {
    el(id).innerHTML = `<p class="empty">Nada aqui ainda.</p>`;
    return;
  }
  const max = Math.max(...rows.map((r) => r.requests), 1);
  el(id).innerHTML = `
    <div class="scroll"><table><thead><tr>
      <th>${esc(heading)}</th><th class="n">req</th><th class="n">tokens</th><th class="n">erros</th><th class="n">média</th>
    </tr></thead><tbody>
    ${rows.map((r) => `<tr>
      <td class="bar"><span style="width:${(r.requests / max) * 100}%"></span><b>${esc(r[key])}</b></td>
      <td class="n">${r.requests}</td>
      <td class="n">${compact(r.tokens)}</td>
      <td class="n" style="color:${r.errors ? "var(--error)" : "inherit"}">${r.errors}</td>
      <td class="n">${ms(r.avg_duration_ms)}</td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

function drawChain() {
  const chain = snapshot.chain;
  const skips = chain.skips.length
    ? `<table><thead><tr><th>Pulou</th><th class="n">vezes</th></tr></thead><tbody>
       ${chain.skips.map((s) => `<tr><td>${esc(s.candidate)}</td><td class="n">${s.count}</td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">Nenhum candidato foi pulado.</p>`;
  el("chain").innerHTML = `
    <div class="figures" style="margin-bottom:12px">
      <div class="figure requests">
        <div class="value">${chain.requests ? pct(chain.first_candidate_rate) : "—"}</div>
        <div class="label">atendidas pelo primeiro candidato</div>
      </div>
    </div>${skips}`;
}

function drawTools() {
  const tools = snapshot.tools;
  if (!tools.length) {
    el("tools").innerHTML = `<p class="empty">Nenhuma ferramenta oferecida nesta janela.</p>`;
    return;
  }
  const usadas = tools.filter((t) => t.called > 0);
  const paradas = tools.length - usadas.length;
  const mostradas = usadas.length ? usadas : tools.slice(0, 3);
  const max = Math.max(...mostradas.map((t) => t.offered), 1);
  el("tools").innerHTML = `
    <div class="scroll"><table><thead><tr>
      <th>Ferramenta</th><th class="n">oferecida</th><th class="n">chamada</th><th class="n">uso</th>
    </tr></thead><tbody>
    ${mostradas.map((t) => `<tr>
      <td class="bar"><span style="width:${(t.offered / max) * 100}%"></span><b>${esc(t.tool)}</b></td>
      <td class="n">${t.offered}</td>
      <td class="n">${t.called}</td>
      <td class="n">${t.call_rate === null ? "—" : pct(t.call_rate)}</td>
    </tr>`).join("")}
    </tbody></table></div>
    ${usadas.length && paradas
      ? `<p class="empty">Mais ${paradas} oferecidas e nunca chamadas nesta janela.</p>`
      : ""}`;
}

function drawErrors() {
  const errors = snapshot.errors;
  el("errors").innerHTML = errors.length
    ? `<table><thead><tr><th>Status</th><th>Tipo</th><th class="n">req</th></tr></thead><tbody>
       ${errors.map((e) => `<tr><td class="num" style="color:var(--error)">${e.status}</td>
         <td>${esc(e.error_type ?? "—")}</td><td class="n">${e.requests}</td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">Nenhum erro nesta janela.</p>`;
}

// A fita mistura duas fontes, e precisa das duas. O SSE so alcança o worker
// que atendeu esta conexão: `make prod` sobe um processo por núcleo, então um
// painel sozinho veria uma fração do tráfego. O resumo, que vem do banco
// compartilhado, completa o resto a cada atualização. O `request_id` decide
// quem já está na tela.
const TAPE_MAX = 40;
const onTape = new Set();

function mergeTape() {
  const tape = el("tape");
  const known = new Set(
    [...tape.children].map((item) => item.dataset.id).filter(Boolean)
  );
  const missing = snapshot.recent.filter((event) => !known.has(event.request_id));
  if (!missing.length) return;
  // Do mais antigo para o mais novo, para que a ordem da tela não inverta.
  for (const event of [...missing].reverse()) {
    tape.insertAdjacentHTML("afterbegin", tapeRow(event, false));
  }
  sortTape();
  trimTape();
}

function sortTape() {
  const tape = el("tape");
  const items = [...tape.children];
  const at = (item) => Date.parse(item.dataset.when || "") || 0;
  items.sort((a, b) => at(b) - at(a));
  for (const item of items) tape.appendChild(item);
}

function applyTapeFilter() {
  const only = el("only-errors").getAttribute("aria-pressed") === "true";
  let shown = 0;
  for (const item of el("tape").children) {
    const hide = only && !item.classList.contains("bad");
    item.hidden = hide;
    if (!hide) shown += 1;
  }
  el("tape-empty").hidden = shown > 0;
}

function trimTape() {
  const tape = el("tape");
  while (tape.children.length > TAPE_MAX) tape.lastElementChild.remove();
  onTape.clear();
  for (const item of tape.children) onTape.add(item.dataset.id);
  applyTapeFilter();
}

// Sem candidato há três histórias diferentes, e o painel dizia a mesma para as
// três. Medido ao vivo: um stream que a cadeia inteira recusou aparecia como
// "estimada aqui", que é o caso de `count_tokens`.
function servedLabel(event, bad) {
  if (event.status === 499) return "cliente desistiu";
  if ((event.route || "").includes("count_tokens")) return "estimada aqui";
  if ((event.route || "").includes("models")) return "catálogo";
  if (bad) return "recusada";
  return "nenhum candidato respondeu";
}

function tapeRow(event, fresh) {
  const when = clock(event.started_at || "", true) || "agora";
  const id = event.request_id || `${when}-${event.route}-${event.duration_ms}`;
  const bad = event.status >= 400 || event.status === 499;
  const classes = ["", fresh ? "fresh" : "", bad ? "bad" : "", event.fell_back ? "fell" : ""].join(" ");
  const served = event.candidate_model || servedLabel(event, bad);
  const tools = (event.tools_called || []).length ? ` · ${esc(event.tools_called.join(", "))}` : "";
  return `<li class="${classes}" data-id="${esc(id)}" data-when="${esc(event.started_at || "")}">
    <span class="when">${esc(when)}</span>
    <span class="what"><b>${esc(served)}</b>
      <small>${esc(event.requested_model || event.route)}${event.stream ? " · stream" : ""}${tools}</small></span>
    <span class="cost">${event.status} · ${ms(event.duration_ms)}</span>
  </li>`;
}

function live() {
  const source = new EventSource("/api/stats/stream");
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    const tape = el("tape");
    if (event.request_id && [...tape.children].some((item) => item.dataset.id === event.request_id)) {
      return;
    }
    tape.insertAdjacentHTML("afterbegin", tapeRow({
      request_id: event.request_id,
      started_at: event.started_at,
      route: event.route,
      requested_model: event.requested_model,
      candidate_model: event.candidate_model,
      status: event.status,
      stream: event.stream,
      duration_ms: event.duration_ms,
      fell_back: event.fell_back,
      tools_called: event.tools_called,
    }, true));
    trimTape();
  };
}

// Limpar é irreversível, então o botão pede o segundo clique dizendo quantas
// linhas vão embora — e se desarma sozinho, para que um clique esquecido na
// aba não vire um DELETE cinco minutos depois.
let armDisarm = null;

function disarmClear() {
  clearTimeout(armDisarm);
  const button = el("clear");
  button.dataset.armed = "false";
  button.textContent = "Limpar histórico";
}

el("clear").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  if (button.dataset.armed !== "true") {
    const total = snapshot?.totals?.requests ?? 0;
    button.dataset.armed = "true";
    button.textContent = `Apagar ${total} da janela e todo o resto?`;
    armDisarm = setTimeout(disarmClear, 8000);
    return;
  }
  clearTimeout(armDisarm);
  button.disabled = true;
  try {
    const response = await fetch("/api/stats/clear", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ confirm: true }),
    });
    const body = await response.json();
    el("clear-said").textContent = response.ok
      ? `${body.deleted} requisições apagadas.`
      : body.error || "não deu para apagar.";
    if (response.ok) {
      el("tape").innerHTML = "";
      onTape.clear();
      await load();
    }
  } catch (err) {
    el("clear-said").textContent = `não deu para apagar: ${err}`;
  } finally {
    button.disabled = false;
    disarmClear();
  }
});

el("only-errors").addEventListener("click", (event) => {
  const button = event.currentTarget;
  const on = button.getAttribute("aria-pressed") === "true";
  button.setAttribute("aria-pressed", String(!on));
  applyTapeFilter();
});

el("widen").addEventListener("click", () => {
  const alvo = document.querySelector('#windows button[data-hours="24"]');
  if (alvo) alvo.click();
});

el("windows").addEventListener("click", (clicked) => {
  const button = clicked.target.closest("button");
  if (!button) return;
  hours = Number(button.dataset.hours);
  for (const other of el("windows").querySelectorAll("button")) {
    other.setAttribute("aria-pressed", String(other === button));
  }
  load();
});

load();
live();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
