<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shunt</title>
<style>
  :root {
    --ground: #0e1620;
    --panel: #16202c;
    --panel-edge: #23303f;
    --ink: #e6eaf0;
    --muted: #8a99ac;
    --dim: #5b6b7e;
    --requests: #5bc8c4;
    --tokens: #e8a33d;
    --fallback: #9b8cf0;
    --error: #e4574c;
    --num: ui-monospace, "SF Mono", "JetBrains Mono", "DejaVu Sans Mono", monospace;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.5 var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }

  /* Barra de estado: uma linha, como o mostrador de um instrumento. */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 22px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--panel-edge);
    background: linear-gradient(180deg, #16202c, #111a24);
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  header h1 span { color: var(--requests); }
  header nav { display: flex; gap: 16px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a[aria-current="page"] { color: var(--ink); border-bottom: 2px solid var(--requests); }
  .state { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
  .state b { color: var(--ink); font-weight: 500; }
  .lamp { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .lamp.on { background: var(--requests); box-shadow: 0 0 8px var(--requests); }
  .lamp.off { background: var(--dim); }
  .lamp.warn { background: var(--tokens); box-shadow: 0 0 8px var(--tokens); }
  .windows { margin-left: auto; display: flex; gap: 2px; }
  .windows button {
    font: inherit;
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .windows button[aria-pressed="true"] { color: var(--ground); background: var(--requests); }
  .windows button:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }

  main { padding: 20px; display: grid; gap: 20px; }
  .flow-band { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; }
  section {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    padding: 14px 16px 16px;
    min-width: 0;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
  }
  h2 em { font-style: normal; color: var(--dim); font-weight: 400; }

  .figures { display: flex; flex-wrap: wrap; gap: 26px; }
  .figure .value { font-family: var(--num); font-size: 26px; line-height: 1.1; }
  .figure .label { font-size: 12px; color: var(--muted); }
  .figure.requests .value { color: var(--requests); }
  .figure.tokens .value { color: var(--tokens); }
  .figure.fallback .value { color: var(--fallback); }
  .figure.errors .value { color: var(--error); }

  .scroll { overflow-x: auto; }
  .scroll table { min-width: 330px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 5px 8px 5px 0; text-align: left; border-bottom: 1px solid #1d2835; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  .bar { position: relative; padding-left: 9px; }
  .bar span {
    position: absolute;
    inset: 2px auto 2px 0;
    background: rgba(91, 200, 196, 0.14);
    border-left: 3px solid var(--requests);
    border-radius: 0 2px 2px 0;
    z-index: 0;
  }
  .bar b { position: relative; font-weight: 400; }

  .tape { max-height: 340px; overflow-y: auto; }
  h2 .toggle {
    float: right;
    font: inherit;
    font-size: 11.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 1px 8px;
    cursor: pointer;
  }
  h2 .toggle[aria-pressed="true"] { color: var(--ground); background: var(--error); border-color: var(--error); }
  h2 .toggle:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }
  .tape li.bad { background: rgba(228, 87, 76, 0.08); }
  .tape li {
    display: grid;
    grid-template-columns: 9ch minmax(0, 1fr) auto;
    gap: 14px;
    padding: 5px 0;
    border-bottom: 1px solid #1d2835;
    font-size: 12.5px;
    align-items: baseline;
  }
  .tape ul { list-style: none; margin: 0; padding: 0; }
  .tape li[hidden] { display: none; }
  .tape .when { color: var(--dim); font-family: var(--num); }
  .tape .what b { font-weight: 500; margin-right: 6px; }
  .tape .what { min-width: 0; overflow-wrap: anywhere; }
  .tape .what small { color: var(--muted); }
  .tape .cost { font-family: var(--num); color: var(--muted); }
  .tape li.bad .what b { color: var(--error); }
  .tape li.fell .what b { color: var(--fallback); }
  .tape li.fresh { animation: land 900ms ease-out; }
  @keyframes land {
    from { background: rgba(91, 200, 196, 0.14); }
    to { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tape li.fresh { animation: none; }
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 0; }
  svg { display: block; width: 100%; height: auto; }
  .axis { fill: var(--dim); font-size: 10px; font-family: var(--num); }
  .flow-label { fill: var(--ink); font-size: 12px; }
  .flow-sub { fill: var(--muted); font-size: 10.5px; font-family: var(--num); }
  footer {
    padding: 0 20px 26px;
    color: var(--dim);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .danger {
    font: inherit;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .danger[data-armed="true"] { color: var(--ground); background: var(--error); border-color: var(--error); }
  .danger:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }
  .danger[disabled] { opacity: 0.5; cursor: default; }
  #clear-said { color: var(--muted); }

  @media (max-width: 860px) {
    .flow-band { grid-template-columns: 1fr; }
    .windows { margin-left: 0; width: 100%; }
    /* O SVG encolhe junto com a tela, e com ele o texto dentro do viewBox.
       Medido em 390 px: rotulo de 12 px virava 6 px, ilegivel. O diagrama
       compensa no proprio desenho (ver `drawFlow`); a serie so precisa do
       texto maior. */
    #series .axis { font-size: 26px; }
  }
</style>
</head>
<body>
<header>
  <h1>SHU<span>N</span>T</h1>
  <nav>
    <a href="/" aria-current="page">Painel</a>
    <a href="/requests">Requisições</a>
  </nav>
  <div class="state" id="state"></div>
  <div class="windows" id="windows">
    <button data-hours="0.0833" aria-pressed="false">5min</button>
    <button data-hours="1" aria-pressed="false">1h</button>
    <button data-hours="24" aria-pressed="true">24h</button>
    <button data-hours="168" aria-pressed="false">7d</button>
  </div>
</header>

<main>
  <div class="flow-band">
    <section>
      <h2>Para onde cada pedido foi <em>largura = requisições</em></h2>
      <div id="flow"></div>
    </section>
    <section class="tape">
      <h2>
        Chegando agora
        <button type="button" id="only-errors" class="toggle" aria-pressed="false">só erros</button>
      </h2>
      <ul id="tape"></ul>
      <p class="empty" id="tape-empty" hidden>Nenhuma falha nesta lista.</p>
    </section>
  </div>

  <section>
    <h2>Resumo da janela</h2>
    <div class="figures" id="figures"></div>
  </section>

  <section>
    <h2>Requisições e tokens por hora</h2>
    <div id="series"></div>
  </section>

  <div class="grid">
    <section><h2>Modelo que respondeu</h2><div id="models"></div></section>
    <section><h2>Provedor</h2><div id="providers"></div></section>
    <section><h2>Rota <em>sob /v1</em></h2><div id="routes"></div></section>
    <section><h2>Cadeia de fallback</h2><div id="chain"></div></section>
    <section><h2>Ferramentas</h2><div id="tools"></div></section>
    <section><h2>Erros</h2><div id="errors"></div></section>
  </div>
</main>

<footer>
  <span id="footer"></span>
  <button type="button" id="clear" class="danger">Limpar histórico</button>
  <span id="clear-said" role="status"></span>
</footer>

<script>
const REFRESH_MS = 15000;
let hours = 24;
let snapshot = null;

const el = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const compact = (n) => {
  if (n === null || n === undefined) return "—";
  if (n < 1000) return String(n);
  if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + "k";
  return (n / 1000000).toFixed(1) + "M";
};
// O banco guarda UTC; quem le o painel vive em outro fuso. Um balde por hora
// vem como "2026-09-19T08:00" sem offset, e sem o "Z" o navegador o leria como
// hora local -- deslocando o gráfico inteiro.
const clock = (iso, withSeconds) => {
  const at = new Date(/[Z+]|[-]\d\d:\d\d$/.test(iso) ? iso : `${iso}Z`);
  if (Number.isNaN(at.getTime())) return "";
  return at.toLocaleTimeString([], {
    hourCycle: "h23",
    hour: "2-digit",
    minute: "2-digit",
    ...(withSeconds ? { second: "2-digit" } : {}),
  });
};
const ms = (v) => (v === null || v === undefined ? "—" : v < 1000 ? v + "ms" : (v / 1000).toFixed(1) + "s");
const pct = (v) => (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%";

async function load() {
  const response = await fetch(`/api/stats?window=${hours}`);
  const fresh = await response.json();
  // `make prod` sobe um worker por núcleo, e cada um tem o seu banco aberto.
  // Um worker que não conseguiu abrir o seu responde um resumo zerado, e a
  // atualização seguinte caía nele e apagava a tela inteira por alguns
  // segundos. Resumo vazio de um banco que existe não substitui o que já está
  // desenhado: só o estado do cabeçalho muda, para que a reconexão apareça.
  const emptyFromABrokenWorker =
    fresh.health && !fresh.health.enabled && fresh.health.configured;
  const hadData = snapshot && snapshot.totals && snapshot.totals.requests > 0;
  if (emptyFromABrokenWorker && hadData && fresh.totals.requests === 0) {
    snapshot = { ...snapshot, health: fresh.health };
    drawState();
    return;
  }
  snapshot = fresh;
  draw();
}

function draw() {
  drawState();
  drawFigures();
  drawFlow();
  drawSeries();
  drawTable("models", snapshot.by_model, "model", "Modelo");
  drawTable("providers", snapshot.by_provider, "provider", "Provedor");
  drawTable("routes", snapshot.by_route.map((r) => ({ ...r, route: r.route.replace(/^\/v1\//, "") })), "route", "Rota em /v1");
  drawChain();
  drawTools();
  drawErrors();
  mergeTape();
}

function drawState() {
  const health = snapshot.health;
  const on = health.enabled;
  const waiting = !on && health.configured;
  const lamp = on ? "on" : waiting ? "warn" : "off";
  const word = on ? "gravando" : waiting ? "reconectando" : "sem banco";
  el("state").innerHTML = `
    <div><span class="lamp ${lamp}"></span>${word}</div>
    <div>fila <b class="num">${health.queued}</b></div>
    <div>descartes <b class="num">${health.dropped}</b></div>
    <div>falhas <b class="num">${health.failures}</b></div>
    <div>lotes <b class="num">${health.commits}</b></div>`;
  el("clear").disabled = !on;
  el("footer").textContent = on
    ? `Uma linha por requisição, gravada em lote fora do caminho da API.`
    : waiting
      ? `Banco configurado e fora de alcance neste worker. Ele tenta reabrir a cada 30 s; o painel ao vivo segue funcionando.`
      : `Persistência desligada: defina TURSO_DATABASE_URL para guardar histórico. O painel ao vivo segue funcionando.`;
}

function drawFigures() {
  const t = snapshot.totals;
  const figures = [
    ["requests", compact(t.requests), "requisições"],
    ["tokens", compact(t.input_tokens + t.output_tokens), `tokens (${compact(t.input_tokens)} entrada)`],
    ["", ms(t.p50_duration_ms), "latência p50"],
    ["", ms(t.p95_duration_ms), "latência p95"],
    ["", ms(t.p50_ttft_ms), "1º token p50"],
    ["fallback", compact(t.fallbacks), "trocas de candidato"],
    ["", ms(t.p95_ttft_ms), "1º token p95"],
    [t.error_rate > 0.05 ? "errors" : "", t.requests ? pct(t.error_rate) : "—", `erros (${t.errors})`],
  ];
  el("figures").innerHTML = figures.map(([kind, value, label]) =>
    `<div class="figure ${kind}"><div class="value">${esc(value)}</div><div class="label">${esc(label)}</div></div>`
  ).join("");
}

// O diagrama que dá nome ao painel: o que foi PEDIDO à esquerda, o que
// RESPONDEU à direita, e a espessura da faixa é o volume. É a pergunta que
// um proxy de substituição de modelo existe para responder.
function drawFlow() {
  const asked = snapshot.by_requested_model.slice(0, 5);
  const served = snapshot.by_model.slice(0, 5);
  if (!asked.length || !served.length) {
    el("flow").innerHTML = `<p class="empty">Nenhuma requisição nesta janela.</p>`;
    return;
  }
  // Medido em 390 px: as duas colunas lado a lado colidem, e o texto escalado
  // pelo viewBox fica ilegível. No estreito o diagrama vira duas faixas
  // empilhadas, com o texto dimensionado em unidades do viewBox.
  const narrow = window.innerWidth <= 860;
  const scale = narrow ? 2 : 1;
  const ROW = 44 * scale;
  const BAR_MAX = 26 * scale;
  const width = 640;

  const side = (list, x, anchor, top, color) => {
    const peak = Math.max(...list.map((item) => item.requests), 1);
    return list.map((item, index) => {
      const name = item.model || item.requested_model;
      const y = top + index * ROW;
      const thickness = Math.max(4, (item.requests / peak) * BAR_MAX);
      const tx = anchor === "end" ? x - 12 : x + 12;
      return `
        <rect x="${anchor === "end" ? x - 5 : x + 1}" y="${y}" width="${4 * scale}" height="${thickness.toFixed(1)}"
              rx="2" fill="${color}" />
        <text class="flow-label" x="${tx}" y="${y + 11 * scale}" text-anchor="${anchor}"
              style="font-size:${12 * scale}px">${esc(name)}</text>
        <text class="flow-sub" x="${tx}" y="${y + 27 * scale}" text-anchor="${anchor}"
              style="font-size:${10.5 * scale}px">${item.requests} req · ${compact(item.tokens)} tok</text>`;
    }).join("");
  };

  if (narrow) {
    const head = 26 * scale;
    const servedTop = head + asked.length * ROW + head;
    const height = servedTop + served.length * ROW + 10;
    el("flow").innerHTML = `
      <svg viewBox="0 0 ${width} ${height}" role="img"
           aria-label="Modelos pedidos e modelos que responderam">
        <text class="axis" x="2" y="${head - 8}" style="font-size:${11 * scale}px">pedido</text>
        ${side(asked, 2, "start", head, "var(--requests)")}
        <text class="axis" x="2" y="${servedTop - 8}" style="font-size:${11 * scale}px">respondeu</text>
        ${side(served, 2, "start", servedTop, "var(--tokens)")}
      </svg>`;
    return;
  }

  const rows = Math.max(asked.length, served.length);
  const height = rows * ROW + 26;
  el("flow").innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" role="img"
         aria-label="Modelos pedidos à esquerda, modelos que responderam à direita">
      <text class="axis" x="2" y="12">pedido</text>
      <text class="axis" x="638" y="12" text-anchor="end">respondeu</text>
      ${side(asked, 2, "start", 24, "var(--requests)")}
      ${side(served, 638, "end", 24, "var(--tokens)")}
      <line x1="320" y1="20" x2="320" y2="${height - 8}" stroke="var(--panel-edge)" />
    </svg>`;
}

function drawSeries() {
  const points = snapshot.per_hour;
  if (!points.length) {
    el("series").innerHTML = `<p class="empty">Sem tráfego nesta janela.</p>`;
    return;
  }
  const width = 960, height = 140, pad = 24;
  const maxRequests = Math.max(...points.map((p) => p.requests), 1);
  const maxTokens = Math.max(...points.map((p) => p.input_tokens + p.output_tokens), 1);
  const step = points.length > 1 ? (width - pad * 2) / (points.length - 1) : 0;
  const x = (i) => (points.length > 1 ? pad + i * step : width / 2);
  const yR = (v) => height - 22 - (v / maxRequests) * (height - 40);
  const yT = (v) => height - 22 - (v / maxTokens) * (height - 40);
  const base = height - 22;
  const ticks = points.map((p, i) => (i % Math.ceil(points.length / 8) === 0
    ? `<text class="axis" x="${x(i).toFixed(1)}" y="${height - 6}" text-anchor="middle">${esc(clock(p.hour, false))}</text>`
    : "")).join("");
  const peak = `<text class="axis" x="${pad}" y="12">pico ${maxRequests} req · ${compact(maxTokens)} tok</text>`;

  // Menos de três horas de tráfego não fazem uma linha: fazem duas barras.
  // O painel de quem acabou de subir o proxy não pode parecer quebrado.
  if (points.length < 3) {
    const barWidth = 26;
    el("series").innerHTML = `
      <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Requisições e tokens por hora">
        ${points.map((p, i) => {
          const cx = x(i);
          const tokens = p.input_tokens + p.output_tokens;
          return `
            <rect x="${cx - barWidth - 3}" y="${yR(p.requests)}" width="${barWidth}"
                  height="${(base - yR(p.requests)).toFixed(1)}" fill="var(--requests)" opacity="0.85" />
            <rect x="${cx + 3}" y="${yT(tokens)}" width="${barWidth}"
                  height="${(base - yT(tokens)).toFixed(1)}" fill="var(--tokens)" opacity="0.85" />
            <text class="flow-sub" x="${cx - barWidth / 2 - 3}" y="${yR(p.requests) - 6}"
                  text-anchor="middle">${p.requests}</text>
            <text class="flow-sub" x="${cx + barWidth / 2 + 3}" y="${yT(tokens) - 6}"
                  text-anchor="middle">${compact(tokens)}</text>`;
        }).join("")}
        <line x1="${pad}" y1="${base}" x2="${width - pad}" y2="${base}" stroke="var(--panel-edge)" />
        ${ticks}${peak}
      </svg>`;
    return;
  }

  const line = (accessor, y) => points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(accessor(p)).toFixed(1)}`).join("");
  el("series").innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Requisições e tokens por hora">
      <path d="${line((p) => p.input_tokens + p.output_tokens, yT)}" fill="none" stroke="var(--tokens)" stroke-width="1.5" opacity="0.8" />
      <path d="${line((p) => p.requests, yR)}" fill="none" stroke="var(--requests)" stroke-width="2" />
      ${points.map((p, i) => p.errors
        ? `<circle cx="${x(i).toFixed(1)}" cy="${yR(p.requests).toFixed(1)}" r="3" fill="var(--error)" />` : "").join("")}
      ${ticks}${peak}
    </svg>`;
}

function drawTable(id, rows, key, heading) {
  if (!rows.length) {
    el(id).innerHTML = `<p class="empty">Nada aqui ainda.</p>`;
    return;
  }
  const max = Math.max(...rows.map((r) => r.requests), 1);
  el(id).innerHTML = `
    <div class="scroll"><table><thead><tr>
      <th>${esc(heading)}</th><th class="n">req</th><th class="n">tokens</th><th class="n">erros</th><th class="n">média</th>
    </tr></thead><tbody>
    ${rows.map((r) => `<tr>
      <td class="bar"><span style="width:${(r.requests / max) * 100}%"></span><b>${esc(r[key])}</b></td>
      <td class="n">${r.requests}</td>
      <td class="n">${compact(r.tokens)}</td>
      <td class="n" style="color:${r.errors ? "var(--error)" : "inherit"}">${r.errors}</td>
      <td class="n">${ms(r.avg_duration_ms)}</td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

function drawChain() {
  const chain = snapshot.chain;
  const skips = chain.skips.length
    ? `<table><thead><tr><th>Pulou</th><th class="n">vezes</th></tr></thead><tbody>
       ${chain.skips.map((s) => `<tr><td>${esc(s.candidate)}</td><td class="n">${s.count}</td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">Nenhum candidato foi pulado.</p>`;
  el("chain").innerHTML = `
    <div class="figures" style="margin-bottom:12px">
      <div class="figure requests">
        <div class="value">${chain.requests ? pct(chain.first_candidate_rate) : "—"}</div>
        <div class="label">atendidas pelo primeiro candidato</div>
      </div>
    </div>${skips}`;
}

function drawTools() {
  const tools = snapshot.tools;
  if (!tools.length) {
    el("tools").innerHTML = `<p class="empty">Nenhuma ferramenta oferecida nesta janela.</p>`;
    return;
  }
  const max = Math.max(...tools.map((t) => t.offered), 1);
  el("tools").innerHTML = `
    <div class="scroll"><table><thead><tr>
      <th>Ferramenta</th><th class="n">oferecida</th><th class="n">chamada</th><th class="n">uso</th>
    </tr></thead><tbody>
    ${tools.map((t) => `<tr>
      <td class="bar"><span style="width:${(t.offered / max) * 100}%"></span><b>${esc(t.tool)}</b></td>
      <td class="n">${t.offered}</td>
      <td class="n">${t.called}</td>
      <td class="n">${t.call_rate === null ? "—" : pct(t.call_rate)}</td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

function drawErrors() {
  const errors = snapshot.errors;
  el("errors").innerHTML = errors.length
    ? `<table><thead><tr><th>Status</th><th>Tipo</th><th class="n">req</th></tr></thead><tbody>
       ${errors.map((e) => `<tr><td class="num" style="color:var(--error)">${e.status}</td>
         <td>${esc(e.error_type ?? "—")}</td><td class="n">${e.requests}</td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">Nenhum erro nesta janela.</p>`;
}

// A fita mistura duas fontes, e precisa das duas. O SSE so alcança o worker
// que atendeu esta conexão: `make prod` sobe um processo por núcleo, então um
// painel sozinho veria uma fração do tráfego. O resumo, que vem do banco
// compartilhado, completa o resto a cada atualização. O `request_id` decide
// quem já está na tela.
const TAPE_MAX = 40;
const onTape = new Set();

function mergeTape() {
  const tape = el("tape");
  const known = new Set(
    [...tape.children].map((item) => item.dataset.id).filter(Boolean)
  );
  const missing = snapshot.recent.filter((event) => !known.has(event.request_id));
  if (!missing.length) return;
  // Do mais antigo para o mais novo, para que a ordem da tela não inverta.
  for (const event of [...missing].reverse()) {
    tape.insertAdjacentHTML("afterbegin", tapeRow(event, false));
  }
  sortTape();
  trimTape();
}

function sortTape() {
  const tape = el("tape");
  const items = [...tape.children];
  const at = (item) => Date.parse(item.dataset.when || "") || 0;
  items.sort((a, b) => at(b) - at(a));
  for (const item of items) tape.appendChild(item);
}

function applyTapeFilter() {
  const only = el("only-errors").getAttribute("aria-pressed") === "true";
  let shown = 0;
  for (const item of el("tape").children) {
    const hide = only && !item.classList.contains("bad");
    item.hidden = hide;
    if (!hide) shown += 1;
  }
  el("tape-empty").hidden = shown > 0;
}

function trimTape() {
  const tape = el("tape");
  while (tape.children.length > TAPE_MAX) tape.lastElementChild.remove();
  onTape.clear();
  for (const item of tape.children) onTape.add(item.dataset.id);
  applyTapeFilter();
}

function tapeRow(event, fresh) {
  const when = clock(event.started_at || "", true) || "agora";
  const id = event.request_id || `${when}-${event.route}-${event.duration_ms}`;
  const bad = event.status >= 400;
  const classes = ["", fresh ? "fresh" : "", bad ? "bad" : "", event.fell_back ? "fell" : ""].join(" ");
  const served = event.candidate_model || (bad ? "recusada" : "estimada aqui");
  const tools = (event.tools_called || []).length ? ` · ${esc(event.tools_called.join(", "))}` : "";
  return `<li class="${classes}" data-id="${esc(id)}" data-when="${esc(event.started_at || "")}">
    <span class="when">${esc(when)}</span>
    <span class="what"><b>${esc(served)}</b>
      <small>${esc(event.requested_model || event.route)}${event.stream ? " · stream" : ""}${tools}</small></span>
    <span class="cost">${event.status} · ${ms(event.duration_ms)}</span>
  </li>`;
}

function live() {
  const source = new EventSource("/api/stats/stream");
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    const tape = el("tape");
    if (event.request_id && [...tape.children].some((item) => item.dataset.id === event.request_id)) {
      return;
    }
    tape.insertAdjacentHTML("afterbegin", tapeRow({
      request_id: event.request_id,
      started_at: event.started_at,
      route: event.route,
      requested_model: event.requested_model,
      candidate_model: event.candidate_model,
      status: event.status,
      stream: event.stream,
      duration_ms: event.duration_ms,
      fell_back: event.fell_back,
      tools_called: event.tools_called,
    }, true));
    trimTape();
  };
}

// Limpar é irreversível, então o botão pede o segundo clique dizendo quantas
// linhas vão embora — e se desarma sozinho, para que um clique esquecido na
// aba não vire um DELETE cinco minutos depois.
let armDisarm = null;

function disarmClear() {
  clearTimeout(armDisarm);
  const button = el("clear");
  button.dataset.armed = "false";
  button.textContent = "Limpar histórico";
}

el("clear").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  if (button.dataset.armed !== "true") {
    const total = snapshot?.totals?.requests ?? 0;
    button.dataset.armed = "true";
    button.textContent = `Apagar ${total} da janela e todo o resto?`;
    armDisarm = setTimeout(disarmClear, 8000);
    return;
  }
  clearTimeout(armDisarm);
  button.disabled = true;
  try {
    const response = await fetch("/api/stats/clear", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ confirm: true }),
    });
    const body = await response.json();
    el("clear-said").textContent = response.ok
      ? `${body.deleted} requisições apagadas.`
      : body.error || "não deu para apagar.";
    if (response.ok) {
      el("tape").innerHTML = "";
      onTape.clear();
      await load();
    }
  } catch (err) {
    el("clear-said").textContent = `não deu para apagar: ${err}`;
  } finally {
    button.disabled = false;
    disarmClear();
  }
});

el("only-errors").addEventListener("click", (event) => {
  const button = event.currentTarget;
  const on = button.getAttribute("aria-pressed") === "true";
  button.setAttribute("aria-pressed", String(!on));
  applyTapeFilter();
});

el("windows").addEventListener("click", (clicked) => {
  const button = clicked.target.closest("button");
  if (!button) return;
  hours = Number(button.dataset.hours);
  for (const other of el("windows").querySelectorAll("button")) {
    other.setAttribute("aria-pressed", String(other === button));
  }
  load();
});

load();
live();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
