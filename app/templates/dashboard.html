<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shunt</title>
<link rel="stylesheet" href="/shunt.css">
<style>
  
  
  

  /* Barra de estado: uma linha, como o mostrador de um instrumento. */

  .state { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .state div:first-child { color: var(--muted); }
  .state b { color: var(--ink); font-weight: 500; }

  .windows { margin-left: auto; display: flex; gap: 2px; }

  main { padding: 12px 20px 20px; display: grid; gap: 20px; }

  /* O mostrador não é um bloco a mais: ele encosta no cabeçalho, não tem
     moldura, e o trilho embaixo marca onde a leitura de estado termina e a
     análise começa. */
  .readout {
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 22px 0 20px;
    margin: 0 -20px;
    padding-left: 20px;
    padding-right: 20px;
    border-bottom: 1px solid var(--edge);
    box-shadow: inset 0 -4px 0 -3px var(--edge-strong);
  }
  /* Uma linha por rota: a barra é o fundo da linha, e não um enfeite ao lado.
     O nome fica legível por cima dela porque a barra é de baixa intensidade. */
  .routes { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .routes li {
    position: relative;
    display: grid;
    grid-template-columns: auto auto auto 1fr 5.5em 3em;
    align-items: baseline;
    gap: 0 10px;
    padding: 7px 10px;
    font-size: 13px;
  }
  .route-bar {
    position: absolute;
    inset: 0 auto 0 0;
    min-width: 6px;
    background: rgba(74, 144, 217, 0.16);
    border-radius: 3px;
  }
  .routes .asked,
  .routes .served,
  .routes .arrow,
  .routes .count,
  .routes .share { position: relative; }
  .routes .asked { color: var(--ink); }
  .routes .arrow { color: var(--dim); }
  .routes .served { color: var(--muted); }
  .routes .served.swapped { color: var(--ink); }
  .routes .count { font-family: var(--mono); text-align: right; color: var(--ink); }
  .routes .count small { color: var(--muted); }
  .routes .share { font-family: var(--mono); text-align: right; color: var(--muted); }

  /* Os dois blocos terminam na mesma linha: `start` deixava o da esquerda
     parar 70px acima do outro, e a faixa lia como recorte torto. A fita tem
     teto proprio e rolagem interna, entao esticar nao a deixa crescer. */
  /* ALTURA FIXA para os dois blocos da faixa, e nao `stretch` sobre conteudo
     de tamanhos diferentes: o diagrama desenha o que couber e a fita rola por
     dentro. Foi assim que as duas secoes passaram a terminar na mesma linha
     sem que uma delas ficasse com um terco de espaco morto. */
  .flow-band {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 20px;
  }
  .flow-band > section {
    height: 380px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #flow {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #flow svg { max-height: 100%; }

  /* As três colunas dividem a faixa na proporção do que carregam: volume tem
     três métricas, latência e saúde têm duas. Larguras iguais deixariam um
     buraco na primeira e apertariam as outras. */
  .figures {
    display: grid;
    grid-template-columns: 3fr 2fr 2fr;
    gap: 0;
    align-items: stretch;
  }
  .group { padding: 0 30px; min-width: 0; }
  .group:first-child { padding-left: 0; }
  .group:last-child { padding-right: 0; }
  .group + .group { border-left: 1px solid var(--edge); }
  .group h3 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  /* Grade, e não fila: cada métrica ocupa uma célula de largura igual dentro
     do grupo, então os valores nascem na mesma linha de base. */
  /* Colunas do tamanho do conteúdo, e não frações iguais: com duas métricas
     numa faixa de três, `1fr` deixava um buraco do tamanho de uma terceira. */
  .group-figures {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(0, max-content));
    gap: 18px 30px;
  }
  .figure .context {
    font-size: 11.5px;
    color: var(--muted);
    opacity: 0.75;
    margin-top: 3px;
  }
  .figure .value small { font-size: 0.5em; font-weight: 500; margin-left: 2px; color: var(--muted); }
  .group h3 { margin: 0 0 8px; font-size: 11.5px; font-weight: 500; color: var(--dim); }
  .group-figures { display: flex; flex-wrap: wrap; gap: 22px; }
  /* Valor de stat tile usa a sans e figuras PROPORCIONAIS: `tabular-nums` dá a
     todo dígito a largura de um zero, e num tamanho de display o número sai
     frouxo. Tabular fica para as colunas das tabelas, onde alinhar importa. */
  .figure .value {
    font-family: var(--text);
    font-size: 27px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .figure .label { font-size: 12.5px; color: var(--ink); margin-top: 2px; }
  .figure .value { color: var(--ink); }
  .figure.errors .value { color: var(--error); }

  .scroll table { min-width: 380px; }

  .bar { position: relative; padding-left: 9px; }
  .bar span {
    position: absolute;
    inset: 2px auto 2px 0;
    background: rgba(74, 144, 217, 0.14);
    border-left: 3px solid var(--requests);
    border-radius: 0 2px 2px 0;
    z-index: 0;
  }
  .bar b { position: relative; font-weight: 400; }

  .tape { display: flex; flex-direction: column; min-height: 0; }
  /* `scrollbar-gutter: stable` reserva a calha: sem ela, a barra cobria a
     duracao no fim de cada linha da fita. */
  .tape ul { flex: 1 1 auto; overflow-y: auto; min-height: 0; scrollbar-gutter: stable; }
  h2 .toggle {
    float: right;
    font: inherit;
    font-size: 11.5px;
    min-height: 24px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 1px 8px;
    cursor: pointer;
  }
  h2 .toggle[aria-pressed="true"] {
    color: #fff;
    background: var(--error);
    border-color: var(--error);
  }
  h2 .toggle:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }
  .tape li.bad { background: rgba(213, 70, 58, 0.10); }
  .tape li {
    display: grid;
    grid-template-columns: 9ch minmax(0, 1fr) 13ch;
    gap: 14px;
    padding: 5px 0;
    border-bottom: 1px solid var(--edge);
    font-size: 12.5px;
    align-items: baseline;
  }
  .tape ul { list-style: none; margin: 0; padding: 0; }
  .tape li[hidden] { display: none; }
  .tape .when { color: var(--dim); font-family: var(--mono); }
  .tape .what b { font-weight: 500; margin-right: 6px; }
  .tape .what { min-width: 0; overflow-wrap: anywhere; }
  .tape .what small { color: var(--muted); }
  .tape li.bad .what small,
  .tape li.fell .what small { color: var(--muted); }
  .tape .cost { font-family: var(--mono); color: var(--muted); text-align: right; }
  .tape li.bad .what b { color: var(--error); }
  .tape li.fell .what b { color: var(--fallback); }
  .tape li.fresh { animation: land 900ms ease-out; }
  @keyframes land {
    from { background: rgba(224, 160, 33, 0.16); }
    to { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tape li.fresh { animation: none; }
  }

  /* Duas faixas: tres blocos em cima, dois embaixo. Numa grade unica de cinco,
     a quinta celula ficava vazia e a faixa de baixo parecia inacabada. */
  .grid + .grid { margin-top: 20px; }

  /* `stretch`, e nao `start`: blocos lado a lado com alturas diferentes
     deixavam a faixa com recorte torto. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
    gap: 20px;
    align-items: stretch;
  }

  /* Janela sem tráfego: uma faixa que explica e oferece a saída vale mais do
     que sete painéis repetindo "nada aqui" em alturas de tela cheia. */
  #nothing {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  #nothing[hidden] { display: none; }
  .nothing-said { margin: 0; color: var(--muted); }

  .ghost:focus-visible { outline: 2px solid var(--tokens); outline-offset: 2px; }
  main.idle .flow-band,
  main.idle > section:not(#nothing),
  main.idle .grid { display: none; }
  svg { display: block; width: 100%; height: auto; }

  .axis.serie { font-size: 11px; font-family: var(--text); }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin: 4px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }
  /* Uma chave por linha em tela estreita: quebradas no meio, "balde / com
     erro" lia como duas chaves diferentes. */
  @media (max-width: 560px) {
    .legend { flex-direction: column; }
  }
  .key::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .key.err::before { background: var(--error); }
  .key.req::before { background: var(--requests); }
  .key.tok::before { background: var(--tokens); }

  .plotwrap { position: relative; }
  .bar-mark { transition: fill 90ms linear; }
  .bar-mark.on { fill: var(--ink); }
  .tip {
    position: absolute;
    pointer-events: none;
    display: grid;
    gap: 2px;
    padding: 7px 10px;
    background: var(--panel-2);
    border: 1px solid var(--edge-strong);
    border-radius: 3px;
    font-size: 12px;
    font-family: var(--mono);
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    z-index: 3;
  }
  .tip[hidden] { display: none; }
  .tip b { font-weight: 600; letter-spacing: 0.04em; }
  .tip .sw {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 7px;
  }
  .tip .sw.req { background: var(--requests); }
  .tip .sw.tok { background: var(--tokens); }
  .tip .sw.err { background: var(--error); }
  .tip .bad { color: var(--error-text); }
  .ribbon { opacity: 0.16; transition: opacity 110ms linear; }
  .ribbon.on { opacity: 0.5; }
  .ribbon.off { opacity: 0.05; }
  .flow-node { cursor: default; }
  .key.fell::before { background: var(--fallback); }
  .flow-label { fill: var(--ink); font-size: 12px; }
  .flow-sub { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
  footer {
    padding: 0 20px 26px;
    color: var(--dim);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .danger[data-armed="true"] { color: var(--ground); background: var(--error); border-color: var(--error); }

  .danger[disabled] { opacity: 0.5; cursor: default; }
  #clear-said { color: var(--muted); }

  @media (max-width: 860px) {
    .figures { grid-template-columns: 1fr; gap: 18px 0; }
    .group { padding: 0; }
    .group + .group {
      border-left: 0;
      border-top: 1px solid var(--edge);
      padding-top: 16px;
    }
    .flow-band { grid-template-columns: 1fr; }
    .flow-band > section { height: auto; }
    .tape { max-height: 420px; }
    /* Seis colunas nao cabem em 390px: o nome do modelo virava quatro linhas
       de duas silabas. Pedido em cima, atendido embaixo, numeros a direita. */
    .routes li {
      grid-template-columns: minmax(0, 1fr) 5.5em 3em;
      align-items: center;
      row-gap: 2px;
    }
    .routes .asked { grid-column: 1; grid-row: 1; }
    .routes .arrow { display: none; }
    .routes .served { grid-column: 1; grid-row: 2; font-size: 12.5px; }
    .routes .count { grid-column: 2; grid-row: 1 / span 2; }
    .routes .share { grid-column: 3; grid-row: 1 / span 2; }
    .windows { margin-left: 0; width: 100%; }
    /* O viewBox estreito ja e quase do tamanho da tela (ver `sizePlot`), entao
       o texto quase nao encolhe. O ajuste aqui e pequeno: 26px, herdados de
       quando o viewBox tinha 960 de largura, empilhavam os carimbos de hora
       um sobre o outro. */
    #series .axis { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>SHU<span>N</span>T</h1>
  <nav>
    <a href="/" aria-current="page">Painel</a>
    <a href="/requests">Requisições</a>
  </nav>
  <div class="state" id="state"></div>
  <div class="windows" id="windows">
    <button data-hours="0.0833" aria-pressed="false">5min</button>
    <button data-hours="1" aria-pressed="false">1h</button>
    <button data-hours="24" aria-pressed="true">24h</button>
    <button data-hours="168" aria-pressed="false">7d</button>
  </div>
</header>

<main>
  <section id="nothing" hidden>
    <p class="nothing-said"></p>
    <button type="button" class="ghost" id="widen">Ver as últimas 24 h</button>
  </section>
  <div class="flow-band">
    <section>
      <h2>Para onde cada pedido foi <em>espessura da fita = participação na janela</em></h2>
      <div id="flow"></div>
    </section>
    <section class="tape">
      <h2>
        Chegando agora
        <button type="button" id="only-errors" class="toggle" aria-pressed="false">só erros</button>
      </h2>
      <ul id="tape"></ul>
      <p class="empty" id="tape-empty" hidden>Nenhuma falha nesta lista.</p>
    </section>
  </div>

  <section class="readout">
    <h2>Resumo da janela</h2>
    <div class="figures" id="figures"></div>
  </section>

  <section>
    <h2 id="series-title">Requisições e tokens por hora</h2>
    <div id="series"></div>
  </section>

  <div class="grid">
    <section><h2>Quem respondeu</h2><div id="models"></div></section>
    <section><h2>Cadeia de fallback</h2><div id="chain"></div></section>
    <section><h2>Ferramentas</h2><div id="tools"></div></section>
  </div>
  <div class="grid">
    <section><h2>Rota <em>sob /v1</em></h2><div id="routes"></div></section>
    <section><h2>Erros</h2><div id="errors"></div></section>
  </div>
</main>

<footer>
  <span id="footer"></span>
  <button type="button" id="clear" class="danger">Limpar histórico</button>
  <span id="clear-said" role="status"></span>
</footer>

<script>
const REFRESH_MS = 15000;
let hours = 24;
let snapshot = null;

const el = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const compact = (n) => {
  if (n === null || n === undefined) return "—";
  if (n < 1000) return String(n);
  if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + "k";
  return (n / 1000000).toFixed(1) + "M";
};
// O banco guarda UTC; quem le o painel vive em outro fuso. Um balde por hora
// vem como "2026-09-19T08:00" sem offset, e sem o "Z" o navegador o leria como
// hora local -- deslocando o gráfico inteiro.
const clock = (iso, withSeconds) => {
  const at = new Date(/[Z+]|[-]\d\d:\d\d$/.test(iso) ? iso : `${iso}Z`);
  if (Number.isNaN(at.getTime())) return "";
  return at.toLocaleTimeString([], {
    hourCycle: "h23",
    hour: "2-digit",
    minute: "2-digit",
    ...(withSeconds ? { second: "2-digit" } : {}),
  });
};
const msParts = (v) => {
  if (v === null || v === undefined) return ["—", ""];
  if (v < 1000) return [String(v), "ms"];
  return [(v / 1000).toFixed(1), "s"];
};
const ms = (v) => (v === null || v === undefined ? "—" : v < 1000 ? v + "ms" : (v / 1000).toFixed(1) + "s");
const pct = (v) => (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%";

async function load() {
  const response = await fetch(`/api/stats?window=${hours}`);
  const fresh = await response.json();
  // `make prod` sobe um worker por núcleo, e cada um tem o seu banco aberto.
  // Um worker que não conseguiu abrir o seu responde um resumo zerado, e a
  // atualização seguinte caía nele e apagava a tela inteira por alguns
  // segundos. Resumo vazio de um banco que existe não substitui o que já está
  // desenhado: só o estado do cabeçalho muda, para que a reconexão apareça.
  const emptyFromABrokenWorker =
    fresh.health && !fresh.health.enabled && fresh.health.configured;
  const hadData = snapshot && snapshot.totals && snapshot.totals.requests > 0;
  if (emptyFromABrokenWorker && hadData && fresh.totals.requests === 0) {
    snapshot = { ...snapshot, health: fresh.health };
    drawState();
    return;
  }
  snapshot = fresh;
  draw();
}

function draw() {
  // Janela vazia: uma faixa com a saída, em vez de sete painéis vazios.
  const idle = (snapshot.totals?.requests ?? 0) === 0;
  document.querySelector("main").classList.toggle("idle", idle);
  el("nothing").hidden = !idle;
  if (idle) {
    const quando =
      hours < 1 ? `nos últimos ${Math.round(hours * 60)} min` : `nas últimas ${hours} h`;
    el("nothing").querySelector(".nothing-said").textContent = snapshot.health?.enabled
      ? `Nenhuma requisição ${quando}.`
      : `Nenhuma requisição ${quando}, e a persistência está desligada.`;
    el("widen").hidden = hours >= 24;
    drawState();
    return;
  }
  drawState();
  drawFigures();
  drawFlow();
  drawSeries();
  drawServed();
  drawTable("routes", snapshot.by_route.map((r) => ({ ...r, route: r.route.replace(/^\/v1\//, "") })), "route", "Rota em /v1");
  drawChain();
  drawTools();
  drawErrors();
  mergeTape();
}

function drawState() {
  const health = snapshot.health;
  const on = health.enabled;
  const waiting = !on && health.configured;
  const lamp = on ? "on" : waiting ? "warn" : "off";
  const word = on ? "gravando" : waiting ? "reconectando" : "sem banco";
  el("state").innerHTML = `
    <div><span class="lamp ${lamp}"></span>${word}</div>
    <div>fila <b class="num">${health.queued}</b></div>
    <div>descartes <b class="num">${health.dropped}</b></div>
    <div>falhas <b class="num">${health.failures}</b></div>
    <div>lotes <b class="num">${health.commits}</b></div>`;
  el("clear").disabled = !on;
  el("footer").textContent = on
    ? `Uma linha por requisição, gravada em lote fora do caminho da API.`
    : waiting
      ? `Banco configurado e fora de alcance neste worker. Ele tenta reabrir a cada 30 s; o painel ao vivo segue funcionando.`
      : `Persistência desligada: defina TURSO_DATABASE_URL para guardar histórico. O painel ao vivo segue funcionando.`;
}

// Um número sozinho não informa: "56 em streaming" de quantas? "51 trocas" de
// quantas? Cada métrica traz o seu contexto embaixo, e as três colunas ficam
// numa grade com a mesma linha de base, para o olho comparar sem tropeçar.
function drawFigures() {
  const t = snapshot.totals;
  const total = t.requests || 0;
  const share = (n) => (total ? `${Math.round((n / total) * 100)}% das requisições` : "—");
  const saida = t.output_tokens;
  const entrada = t.input_tokens;

  const grupos = [
    [
      "Volume",
      [
        ["", [compact(total), ""], "requisições", `na janela de ${windowName()}`],
        [
          "",
          [compact(entrada + saida), ""],
          "tokens",
          `${compact(entrada)} entrada · ${compact(saida)} saída`,
        ],
        ["", [compact(t.streams), ""], "em streaming", share(t.streams)],
      ],
    ],
    [
      "Latência",
      [
        ["", msParts(t.p50_duration_ms), "mediana", `p95 ${ms(t.p95_duration_ms)}`],
        ["", msParts(t.p50_ttft_ms), "1º token", `p95 ${ms(t.p95_ttft_ms)}`],
      ],
    ],
    [
      "Saúde",
      [
        [
          t.error_rate > 0.05 ? "errors" : "",
          [String(t.errors), ""],
          t.errors === 1 ? "erro" : "erros",
          total ? `${pct(t.error_rate)} das requisições` : "—",
        ],
        ["", [compact(t.fallbacks), ""], "trocas de candidato", share(t.fallbacks)],
      ],
    ],
  ];

  el("figures").innerHTML = grupos
    .map(
      ([titulo, figuras]) => `
      <div class="group">
        <h3>${esc(titulo)}</h3>
        <div class="group-figures">
          ${figuras
            .map(
              ([kind, [value, unit], label, context]) => `
              <div class="figure ${kind}">
                <div class="value">${esc(value)}<small>${esc(unit)}</small></div>
                <div class="label">${esc(label)}</div>
                <div class="context">${esc(context)}</div>
              </div>`
            )
            .join("")}
        </div>
      </div>`
    )
    .join("");
}

function windowName() {
  if (hours < 1) return `${Math.round(hours * 60)} min`;
  if (hours < 48) return `${Math.round(hours)} h`;
  return `${Math.round(hours / 24)} dias`;
}

// O que este proxy faz é desviar: alguém pede um modelo e outro responde. A
// lista diz isso numa linha por rota — pedido, quem atendeu, quanto — com a
// barra carregando a proporção. Um Sankey de três por três gastava trezentos
// pixels para dizer o mesmo.
// O diagrama de fitas: cada fita sai do modelo PEDIDO e entra no modelo que
// RESPONDEU, com espessura proporcional ao volume. Ele voltou a pedido do
// usuário depois de eu o ter trocado por uma lista — a lista dizia os mesmos
// números, mas não mostrava um pedido se dividindo entre dois provedores.
function drawFlow() {
  const pairs = snapshot.pairs || [];
  if (!pairs.length) {
    el("flow").innerHTML = `<p class="empty">Nenhuma requisição atendida nesta janela.</p>`;
    return;
  }

  const narrow = window.innerWidth <= 860;
  const scale = narrow ? 1.9 : 1;
  const W = narrow ? 640 : 1000;
  // O texto dentro do viewBox encolhe junto com o SVG; `type` é o fator que
  // devolve o tamanho lido na tela.
  const type = (W / 640) * scale;
  const GAP = 10 * type;
  const left = 4;
  const right = W - 4;

  // Um nó por modelo de cada lado, com altura proporcional ao volume.
  const side = (key) => {
    const totals = new Map();
    for (const pair of pairs) totals.set(pair[key], (totals.get(pair[key]) || 0) + pair.requests);
    return [...totals.entries()].sort((a, b) => b[1] - a[1]);
  };
  const asked = side("asked");
  const served = side("served");
  const total = pairs.reduce((sum, pair) => sum + pair.requests, 0) || 1;

  const TOP = 40 * type;
  const LABEL = 22 * type;
  // A altura vem do conteúdo: uma barra mínima por modelo, o resto repartido
  // pelo volume. Calcular antes é o que garante que o último nó caiba.
  const rows = Math.max(asked.length, served.length);
  const barSpace = Math.max(120 * type, rows * 26 * type);
  const H = TOP + barSpace + rows * (GAP + LABEL) + 10;

  const place = (list) => {
    const map = new Map();
    let y = TOP;
    for (const [name, count] of list) {
      const height = Math.max(8 * type, (count / total) * barSpace);
      map.set(name, { y, height, count });
      y += height + GAP + LABEL;
    }
    return map;
  };
  const leftNodes = place(asked);
  const rightNodes = place(served);

  const node = (map, x, anchor, color, lado) =>
    [...map.entries()]
      .map(([name, box]) => {
        const tx = anchor === "end" ? x - 10 : x + 10;
        return `
          <g class="flow-node" data-lado="${lado}" data-nome="${esc(name)}">
            <rect x="${anchor === "end" ? x - 5 : x + 1}" y="${box.y.toFixed(1)}" width="4"
                  height="${box.height.toFixed(1)}" rx="2" fill="${color}" />
            <text class="flow-label" x="${tx}" y="${(box.y - 7 * type).toFixed(1)}"
                  text-anchor="${anchor}" style="font-size:${12 * type}px">${esc(name)}</text>
            <text class="flow-sub" x="${tx}" y="${(box.y + 13 * type).toFixed(1)}"
                  text-anchor="${anchor}" style="font-size:${10.5 * type}px">${box.count} req</text>
          </g>`;
      })
      .join("");

  // Cada fita sai do nó pedido e entra no nó que respondeu, empilhando-se
  // dentro de ambos — é isso que deixa ver que um pedido se dividiu.
  const usedLeft = new Map();
  const usedRight = new Map();
  const ribbons = pairs
    .map((pair) => {
      const from = leftNodes.get(pair.asked);
      const to = rightNodes.get(pair.served);
      if (!from || !to) return "";
      const share = pair.requests / total;
      const thickness = Math.max(2, share * barSpace);
      const y1 = from.y + (usedLeft.get(pair.asked) || 0);
      const y2 = to.y + (usedRight.get(pair.served) || 0);
      usedLeft.set(pair.asked, (usedLeft.get(pair.asked) || 0) + thickness);
      usedRight.set(pair.served, (usedRight.get(pair.served) || 0) + thickness);
      const x1 = left + 6;
      const x2 = right - 6;
      const mid = (x1 + x2) / 2;
      const path = [
        `M${x1},${y1.toFixed(1)}`,
        `C${mid},${y1.toFixed(1)} ${mid},${y2.toFixed(1)} ${x2},${y2.toFixed(1)}`,
        `L${x2},${(y2 + thickness).toFixed(1)}`,
        `C${mid},${(y2 + thickness).toFixed(1)} ${mid},${(y1 + thickness).toFixed(1)} ${x1},${(y1 + thickness).toFixed(1)}`,
        "Z",
      ].join(" ");
      // Um pedido que foi para outro modelo é a informação que traz alguém a
      // esta tela: ela ganha a cor do desvio, e o caminho direto fica azul.
      const desvio = pair.asked !== pair.served;
      const cor = desvio ? "var(--fallback)" : "var(--requests)";
      const parte = Math.round(share * 100);
      const title = `${pair.asked} → ${pair.served}: ${pair.requests} req · ${parte}% · ${compact(pair.tokens)} tok`;
      return `<path class="ribbon" fill="${cor}"
                    data-pedido="${esc(pair.asked)}" data-servido="${esc(pair.served)}"
                    d="${path}"><title>${esc(title)}</title></path>`;
    })
    .join("");

  el("flow").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Fitas ligando o modelo pedido ao modelo que respondeu">
      <text class="axis" x="${left}" y="${12 * type}" style="font-size:${10 * type}px">modelo pedido</text>
      <text class="axis" x="${right}" y="${12 * type}" text-anchor="end"
            style="font-size:${10 * type}px">modelo que respondeu</text>
      ${ribbons}
      ${node(leftNodes, left, "start", "var(--requests)", "pedido")}
      ${node(rightNodes, right, "end", "var(--tokens)", "servido")}
    </svg>
    <p class="legend">
      <span class="key req">atendido pelo modelo pedido</span>
      <span class="key fell">respondido por outro modelo</span>
    </p>`;
  wireFlow();
}

// Passar o cursor por um nó acende só as fitas que passam por ele: com cinco
// modelos de cada lado, as fitas se cruzam e o olho perde o fio.
function wireFlow() {
  const svg = el("flow").querySelector("svg");
  if (!svg) return;
  const fitas = [...svg.querySelectorAll(".ribbon")];
  const acender = (lado, nome) => {
    for (const fita of fitas) {
      const chave = lado === "pedido" ? fita.dataset.pedido : fita.dataset.servido;
      fita.classList.toggle("on", chave === nome);
      fita.classList.toggle("off", chave !== nome);
    }
  };
  const apagar = () => {
    for (const fita of fitas) fita.classList.remove("on", "off");
  };
  for (const no of svg.querySelectorAll(".flow-node")) {
    no.addEventListener("mouseenter", () => acender(no.dataset.lado, no.dataset.nome));
    no.addEventListener("mouseleave", apagar);
  }
  for (const fita of fitas) {
    fita.addEventListener("mouseenter", () => {
      for (const outra of fitas) {
        outra.classList.toggle("on", outra === fita);
        outra.classList.toggle("off", outra !== fita);
      }
    });
    fita.addEventListener("mouseleave", apagar);
  }
}

// UM gráfico, duas grandezas, dois eixos — pedido do usuário depois de ver a
// versão empilhada. Duas escalas no mesmo plot sugerem uma correlação que o
// dado não prova, então a leitura é amarrada de três jeitos: cada eixo é
// rotulado NA COR da sua série, a barra e a linha têm formas diferentes, e o
// cursor entrega o número exato dos dois lados no mesmo balão.
function drawSeries() {
  const serie = snapshot.series || { bucket_minutes: 60, points: [] };
  const points = serie.points || [];
  const bucket = (serie.bucket_minutes || 60) * 60 * 1000;
  sizePlot();
  el("series-title").textContent = `Requisições e tokens ${bucketName(serie.bucket_minutes || 60)}`;
  if (!points.length) {
    el("series").innerHTML = `<p class="empty">Sem tráfego nesta janela.</p>`;
    return;
  }

  const at = (p) => new Date(`${p.at}Z`).getTime();
  const from = at(points[0]) - bucket / 2;
  const to = at(points[points.length - 1]) + bucket / 2;
  const span = Math.max(to - from, bucket);

  el("series").innerHTML = `
    <div class="plotwrap">
      ${plot({ points, from, span, bucket })}
      <div class="tip" id="tip" hidden></div>
    </div>
    <p class="legend">
      <span class="key req">requisições (barra, eixo esquerdo)</span>
      <span class="key tok">tokens (linha, eixo direito)</span>
      ${points.some((p) => p.errors) ? `<span class="key err">balde com erro</span>` : ""}
    </p>`;
  wireSeries(points);
}

// Geometria compartilhada entre o desenho e o cursor: o balão precisa saber
// onde cada balde caiu, e recalcular isso do lado de fora daria divergência.
// Em tela estreita o desenho e REDESENHADO mais alto, e nao encolhido: o SVG
// guarda a proporcao do viewBox, entao 960x250 a 350px de largura virava uma
// tira de 91px onde nao se enxerga barra nenhuma.
let PLOT = { W: 960, H: 250, padL: 56, padR: 62, padT: 26, padB: 30 };

function sizePlot() {
  PLOT = window.innerWidth < 700
    ? { W: 420, H: 300, padL: 44, padR: 50, padT: 26, padB: 34 }
    : { W: 960, H: 250, padL: 56, padR: 62, padT: 26, padB: 30 };
}

// Redesenha quando a janela muda de faixa: a proporcao do plot depende dela.
let larguraAnterior = window.innerWidth;
window.addEventListener("resize", () => {
  const antes = larguraAnterior < 700;
  larguraAnterior = window.innerWidth;
  if (antes !== (larguraAnterior < 700)) drawSeries();
});

function plotGeometry(points, from, span) {
  const { W, H, padL, padR, padT, padB } = PLOT;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const base = padT + plotH;
  const tokensOf = (p) => p.input_tokens + p.output_tokens;
  const maxReq = Math.max(...points.map((p) => p.requests), 1);
  const maxTok = Math.max(...points.map(tokensOf), 1);
  return {
    plotW, plotH, base, tokensOf, maxReq, maxTok,
    x: (t) => padL + ((t - from) / span) * plotW,
    yReq: (v) => base - (v / maxReq) * plotH,
    yTok: (v) => base - (v / maxTok) * plotH,
  };
}

function plot({ points, from, span, bucket }) {
  const { W, H, padL, padR, padT, padB } = PLOT;
  const g = plotGeometry(points, from, span);
  const at = (p) => new Date(`${p.at}Z`).getTime();
  const barW = Math.max(3, Math.min(34, (bucket / span) * g.plotW - 2));

  // Grade sólida e recessiva: tracejado lê como limite ou projeção, e aqui é
  // só escala. Ela pertence ao eixo esquerdo; o direito só ganha rótulo.
  const grid = [0, 0.5, 1]
    .map(
      (f) => `<line x1="${padL}" y1="${(g.base - f * g.plotH).toFixed(1)}" x2="${W - padR}"
                    y2="${(g.base - f * g.plotH).toFixed(1)}" stroke="var(--edge)" />`
    )
    .join("");

  const escala = `
    <text class="axis" x="${padL - 10}" y="${padT + 4}" text-anchor="end"
          fill="var(--requests)">${g.maxReq}</text>
    <text class="axis" x="${padL - 10}" y="${g.base + 4}" text-anchor="end">0</text>
    <text class="axis" x="${W - padR + 10}" y="${padT + 4}" text-anchor="start"
          fill="var(--tokens)">${compact(g.maxTok)}</text>
    <text class="axis" x="${W - padR + 10}" y="${g.base + 4}" text-anchor="start">0</text>`;

  const barras = points
    .map((p) => {
      const top = g.yReq(p.requests);
      return `<rect class="bar-mark" data-i="${points.indexOf(p)}"
                    x="${(g.x(at(p)) - barW / 2).toFixed(1)}" y="${top.toFixed(1)}"
                    width="${barW.toFixed(1)}" height="${Math.max(1, g.base - top).toFixed(1)}"
                    rx="2" fill="var(--requests)" />`;
    })
    .join("");

  const linha = `<path d="${points
    .map((p, i) => `${i ? "L" : "M"}${g.x(at(p)).toFixed(1)},${g.yTok(g.tokensOf(p)).toFixed(1)}`)
    .join("")}" fill="none" stroke="var(--tokens)" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round" />`;

  const erros = points
    .filter((p) => p.errors)
    .map(
      (p) =>
        `<circle cx="${g.x(at(p)).toFixed(1)}" cy="${(g.yReq(p.requests) - 9).toFixed(1)}" r="3.5"
                 fill="var(--error)" stroke="var(--panel)" stroke-width="2" />`
    )
    .join("");

  // Menos rotulos em tela estreita: o texto dentro do viewBox cresce quando o
   // SVG encolhe, e oito carimbos de hora se sobrepunham a 390px (medido pela
   // varredura de UI).
  const quantos = window.innerWidth < 700 ? 4 : 8;
  const step = Math.max(1, Math.ceil(points.length / quantos));
  const eixoX = points
    .filter((_, i) => i % step === 0)
    .map((p, i) => {
      // O primeiro rótulo nasce ancorado à esquerda: centrado, ele recua para
      // debaixo da escala e encosta no zero em telas estreitas.
      const anchor = i === 0 ? "start" : "middle";
      const cx = i === 0 ? Math.max(g.x(at(p)) - 10, padL) : g.x(at(p));
      return `<text class="axis" x="${cx.toFixed(1)}" y="${H - 6}"
                    text-anchor="${anchor}">${esc(clock(p.at, false))}</text>`;
    })
    .join("");

  // Faixa de captura por balde: o alvo do cursor é a coluna inteira, e não a
  // barra de 3px que sobra num balde quase vazio.
  const faixaW = g.plotW / points.length;
  const faixas = points
    .map(
      (p, i) =>
        `<rect class="hit" data-i="${i}" x="${(padL + i * faixaW).toFixed(1)}" y="${padT}"
               width="${faixaW.toFixed(1)}" height="${g.plotH.toFixed(1)}" fill="transparent" />`
    )
    .join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" id="plot"
               aria-label="requisições e tokens ao longo do tempo">
    ${grid}${escala}
    <line id="crosshair" y1="${padT}" y2="${g.base}" x1="0" x2="0"
          stroke="var(--edge-strong)" stroke-width="1" visibility="hidden" />
    ${barras}${linha}${erros}
    <circle id="dot" r="4.5" fill="var(--tokens)" stroke="var(--panel)" stroke-width="2"
            visibility="hidden" />
    ${eixoX}${faixas}
  </svg>`;
}

// O balão segue o balde sob o cursor e mostra os DOIS números: é o que impede
// alguém de ler altura de barra contra altura de linha como se fosse a mesma
// escala.
function wireSeries(points) {
  const svg = el("plot");
  const tip = el("tip");
  const crosshair = svg.querySelector("#crosshair");
  const dot = svg.querySelector("#dot");
  const wrap = svg.parentElement;
  const serie = snapshot.series || {};
  const bucket = (serie.bucket_minutes || 60) * 60 * 1000;
  const at = (p) => new Date(`${p.at}Z`).getTime();
  const from = at(points[0]) - bucket / 2;
  const span = Math.max(at(points[points.length - 1]) + bucket / 2 - from, bucket);
  const g = plotGeometry(points, from, span);

  const esconder = () => {
    tip.hidden = true;
    crosshair.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden");
    for (const bar of svg.querySelectorAll(".bar-mark")) bar.classList.remove("on");
  };

  const mostrar = (i) => {
    const p = points[i];
    if (!p) return;
    const cx = g.x(at(p));
    crosshair.setAttribute("x1", cx);
    crosshair.setAttribute("x2", cx);
    crosshair.setAttribute("visibility", "visible");
    dot.setAttribute("cx", cx);
    dot.setAttribute("cy", g.yTok(g.tokensOf(p)));
    dot.setAttribute("visibility", "visible");
    for (const bar of svg.querySelectorAll(".bar-mark")) {
      bar.classList.toggle("on", Number(bar.dataset.i) === i);
    }
    tip.innerHTML = `
      <b>${esc(clock(p.at, false))}</b>
      <span><i class="sw req"></i>${p.requests} req</span>
      <span><i class="sw tok"></i>${compact(g.tokensOf(p))} tokens</span>
      ${p.errors ? `<span class="bad"><i class="sw err"></i>${p.errors} com erro</span>` : ""}`;
    tip.hidden = false;
    // A posição sai da caixa medida do SVG, e não do viewBox: o desenho
    // encolhe com a tela e a conversão de coordenadas encolhe junto.
    const caixa = svg.getBoundingClientRect();
    const escala = caixa.width / PLOT.W;
    const esquerda = cx * escala;
    tip.style.left = `${Math.min(Math.max(esquerda, 8), caixa.width - tip.offsetWidth - 8)}px`;
    tip.style.top = `${Math.max(g.yReq(p.requests) * escala - tip.offsetHeight - 12, 4)}px`;
  };

  for (const faixa of svg.querySelectorAll(".hit")) {
    faixa.addEventListener("mouseenter", () => mostrar(Number(faixa.dataset.i)));
  }
  wrap.addEventListener("mouseleave", esconder);
}

function bucketName(minutes) {
  if (minutes === 1) return "por minuto";
  if (minutes < 60) return `a cada ${minutes} min`;
  if (minutes === 60) return "por hora";
  if (minutes < 60 * 24) return `a cada ${minutes / 60} h`;
  return "por dia";
}

// Modelo e provedor na mesma linha: são a mesma resposta vista de dois lados, e
// duas tabelas com os mesmos números pediam ao leitor que descobrisse isso.
function drawServed() {
  const rows = snapshot.by_model || [];
  if (!rows.length) {
    el("models").innerHTML = `<p class="empty">Nada aqui ainda.</p>`;
    return;
  }
  const provedorDe = new Map();
  for (const par of snapshot.pairs || []) provedorDe.set(par.served, null);
  const provedores = snapshot.by_provider || [];
  el("models").innerHTML = `
    <div class="scroll"><table><thead><tr>
      <th>Modelo</th><th>Provedor</th><th class="n">req</th>
      <th class="n">tokens</th><th class="n">erros</th><th class="n">média</th>
    </tr></thead><tbody>
    ${rows
      .map((r, i) => {
        const provedor = provedores[i] ? provedores[i].provider : "—";
        return `<tr>
          <td><b>${esc(r.model)}</b></td>
          <td class="muted">${esc(provedor)}</td>
          <td class="n">${r.requests}</td>
          <td class="n">${compact(r.tokens)}</td>
          <td class="n" style="color:${r.errors ? "var(--error-text)" : "inherit"}">${r.errors}</td>
          <td class="n">${ms(r.avg_duration_ms)}</td>
        </tr>`;
      })
      .join("")}
    </tbody></table></div>`;
}

function drawTable(id, rows, key, heading) {
  if (!rows.length) {
    el(id).innerHTML = `<p class="empty">Nada aqui ainda.</p>`;
    return;
  }
  el(id).innerHTML = `
    <div class="scroll"><table><thead><tr>
      <th>${esc(heading)}</th><th class="n">req</th><th class="n">tokens</th><th class="n">erros</th><th class="n">média</th>
    </tr></thead><tbody>
    ${rows.map((r) => `<tr>
      <td><b>${esc(r[key])}</b></td>
      <td class="n">${r.requests}</td>
      <td class="n">${compact(r.tokens)}</td>
      <td class="n" style="color:${r.errors ? "var(--error-text)" : "inherit"}">${r.errors}</td>
      <td class="n">${ms(r.avg_duration_ms)}</td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

function drawChain() {
  const chain = snapshot.chain;
  const skips = chain.skips.length
    ? `<table><thead><tr><th>Pulou</th><th class="n">vezes</th></tr></thead><tbody>
       ${chain.skips.map((s) => `<tr><td>${esc(s.candidate)}</td><td class="n">${s.count}</td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">Nenhum candidato foi pulado.</p>`;
  el("chain").innerHTML = `
    <div class="figures" style="margin-bottom:12px">
      <div class="figure requests">
        <div class="value">${chain.requests ? pct(chain.first_candidate_rate) : "—"}</div>
        <div class="label">atendidas pelo primeiro candidato</div>
      </div>
    </div>${skips}`;
}

function drawTools() {
  const tools = snapshot.tools;
  if (!tools.length) {
    el("tools").innerHTML = `<p class="empty">Nenhuma ferramenta oferecida nesta janela.</p>`;
    return;
  }
  const usadas = tools.filter((t) => t.called > 0);
  const paradas = tools.length - usadas.length;
  const mostradas = usadas.length ? usadas : tools.slice(0, 3);
  el("tools").innerHTML = `
    <div class="scroll"><table><thead><tr>
      <th>Ferramenta</th><th class="n">oferecida</th><th class="n">chamada</th><th class="n">uso</th>
    </tr></thead><tbody>
    ${mostradas.map((t) => `<tr>
      <td><b>${esc(t.tool)}</b></td>
      <td class="n">${t.offered}</td>
      <td class="n">${t.called}</td>
      <td class="n">${t.call_rate === null ? "—" : pct(t.call_rate)}</td>
    </tr>`).join("")}
    </tbody></table></div>
    ${usadas.length && paradas
      ? `<p class="empty">Mais ${paradas} oferecidas e nunca chamadas nesta janela.</p>`
      : ""}`;
}

function drawErrors() {
  const errors = snapshot.errors;
  el("errors").innerHTML = errors.length
    ? `<table><thead><tr><th>Status</th><th>Tipo</th><th class="n">req</th></tr></thead><tbody>
       ${errors.map((e) => `<tr><td class="num" style="color:var(--error-text)">${e.status}</td>
         <td>${esc(e.error_type ?? "—")}</td><td class="n">${e.requests}</td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">Nenhum erro nesta janela.</p>`;
}

// A fita mistura duas fontes, e precisa das duas. O SSE so alcança o worker
// que atendeu esta conexão: `make prod` sobe um processo por núcleo, então um
// painel sozinho veria uma fração do tráfego. O resumo, que vem do banco
// compartilhado, completa o resto a cada atualização. O `request_id` decide
// quem já está na tela.
const TAPE_MAX = 40;
const onTape = new Set();

function mergeTape() {
  const tape = el("tape");
  const known = new Set(
    [...tape.children].map((item) => item.dataset.id).filter(Boolean)
  );
  const missing = snapshot.recent.filter((event) => !known.has(event.request_id));
  if (!missing.length) return;
  // Do mais antigo para o mais novo, para que a ordem da tela não inverta.
  for (const event of [...missing].reverse()) {
    tape.insertAdjacentHTML("afterbegin", tapeRow(event, false));
  }
  sortTape();
  trimTape();
}

function sortTape() {
  const tape = el("tape");
  const items = [...tape.children];
  const at = (item) => Date.parse(item.dataset.when || "") || 0;
  items.sort((a, b) => at(b) - at(a));
  for (const item of items) tape.appendChild(item);
}

function applyTapeFilter() {
  const only = el("only-errors").getAttribute("aria-pressed") === "true";
  let shown = 0;
  for (const item of el("tape").children) {
    const hide = only && !item.classList.contains("bad");
    item.hidden = hide;
    if (!hide) shown += 1;
  }
  el("tape-empty").hidden = shown > 0;
}

function trimTape() {
  const tape = el("tape");
  while (tape.children.length > TAPE_MAX) tape.lastElementChild.remove();
  onTape.clear();
  for (const item of tape.children) onTape.add(item.dataset.id);
  applyTapeFilter();
}

// Sem candidato há três histórias diferentes, e o painel dizia a mesma para as
// três. Medido ao vivo: um stream que a cadeia inteira recusou aparecia como
// "estimada aqui", que é o caso de `count_tokens`.
function servedLabel(event, bad) {
  if (event.status === 499) return "cliente desistiu";
  if ((event.route || "").includes("count_tokens")) return "estimada aqui";
  if ((event.route || "").includes("models")) return "catálogo";
  if (bad) return "recusada";
  return "nenhum candidato respondeu";
}

function tapeRow(event, fresh) {
  const when = clock(event.started_at || "", true) || "agora";
  const id = event.request_id || `${when}-${event.route}-${event.duration_ms}`;
  const bad = event.status >= 400 || event.status === 499;
  const classes = ["", fresh ? "fresh" : "", bad ? "bad" : "", event.fell_back ? "fell" : ""].join(" ");
  const served = event.candidate_model || servedLabel(event, bad);
  const tools = (event.tools_called || []).length ? ` · ${esc(event.tools_called.join(", "))}` : "";
  return `<li class="${classes}" data-id="${esc(id)}" data-when="${esc(event.started_at || "")}">
    <span class="when">${esc(when)}</span>
    <span class="what"><b>${esc(served)}</b>
      <small>${esc(event.requested_model || event.route)}${event.stream ? " · stream" : ""}${tools}</small></span>
    <span class="cost">${event.status} · ${ms(event.duration_ms)}</span>
  </li>`;
}

function live() {
  const source = new EventSource("/api/stats/stream");
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    const tape = el("tape");
    if (event.request_id && [...tape.children].some((item) => item.dataset.id === event.request_id)) {
      return;
    }
    tape.insertAdjacentHTML("afterbegin", tapeRow({
      request_id: event.request_id,
      started_at: event.started_at,
      route: event.route,
      requested_model: event.requested_model,
      candidate_model: event.candidate_model,
      status: event.status,
      stream: event.stream,
      duration_ms: event.duration_ms,
      fell_back: event.fell_back,
      tools_called: event.tools_called,
    }, true));
    trimTape();
  };
}

// Limpar é irreversível, então o botão pede o segundo clique dizendo quantas
// linhas vão embora — e se desarma sozinho, para que um clique esquecido na
// aba não vire um DELETE cinco minutos depois.
let armDisarm = null;

function disarmClear() {
  clearTimeout(armDisarm);
  const button = el("clear");
  button.dataset.armed = "false";
  button.textContent = "Limpar histórico";
}

el("clear").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  if (button.dataset.armed !== "true") {
    const total = snapshot?.totals?.requests ?? 0;
    button.dataset.armed = "true";
    button.textContent = `Apagar ${total} da janela e todo o resto?`;
    armDisarm = setTimeout(disarmClear, 8000);
    return;
  }
  clearTimeout(armDisarm);
  button.disabled = true;
  try {
    const response = await fetch("/api/stats/clear", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ confirm: true }),
    });
    const body = await response.json();
    el("clear-said").textContent = response.ok
      ? `${body.deleted} requisições apagadas.`
      : body.error || "não deu para apagar.";
    if (response.ok) {
      el("tape").innerHTML = "";
      onTape.clear();
      await load();
    }
  } catch (err) {
    el("clear-said").textContent = `não deu para apagar: ${err}`;
  } finally {
    button.disabled = false;
    disarmClear();
  }
});

el("only-errors").addEventListener("click", (event) => {
  const button = event.currentTarget;
  const on = button.getAttribute("aria-pressed") === "true";
  button.setAttribute("aria-pressed", String(!on));
  applyTapeFilter();
});

el("widen").addEventListener("click", () => {
  const alvo = document.querySelector('#windows button[data-hours="24"]');
  if (alvo) alvo.click();
});

el("windows").addEventListener("click", (clicked) => {
  const button = clicked.target.closest("button");
  if (!button) return;
  hours = Number(button.dataset.hours);
  for (const other of el("windows").querySelectorAll("button")) {
    other.setAttribute("aria-pressed", String(other === button));
  }
  load();
});

load();
live();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
