{% if versions %}
<div class="table-container">
<table class="history-table">
<thead><tr>
  <th>ID</th>
  <th>Data/Hora</th>
  <th>Ações</th>
</tr></thead>
<tbody>
{% for v in versions %}
<tr>
  <td class="n">{{ v.id }}</td>
  <td>
    <div>{{ v.created_at.strftime("%Y-%m-%d %H:%M:%S") }}</div>
    <div class="meta">snapshot {{ v.snapshot_json|length }} chars</div>
  </td>
  <td class="n">
    <div class="actions">
      <form class="inline-form" hx-post="/admin/config/rollback/{{ v.id }}" hx-target="#history-content" hx-swap="outerHTML" hx-confirm="Restaurar versão {{ v.id }}? Isso substituirá toda a configuração atual.">
        <button type="submit" class="btn btn-sm btn-primary">Restaurar</button>
      </form>
    </div>
  </td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
{% else %}
<p class="empty-state">Nenhuma versão de configuração salva.</p>
{% endif %}
