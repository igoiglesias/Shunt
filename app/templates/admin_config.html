<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shunt — Configuração</title>
<link rel="stylesheet" href="/shunt.css">
<style>
  /* Admin-specific styles */
  .admin-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .admin-nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border: 1px solid var(--edge); border-radius: 2px; font-size: 13px; }
  .admin-nav a:hover { color: var(--ink); border-color: var(--edge-strong); }
  .admin-nav a[aria-current="page"] { color: var(--ground); background: var(--ink); font-weight: 600; }

  .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .form-group input, .form-group select { color: var(--ink); background: var(--panel-2); border: 1px solid var(--edge); border-radius: 2px; padding: 6px 10px; font-size: 13px; }
  .form-group input:focus, .form-group select:focus { outline: 2px solid var(--warning); outline-offset: 2px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-row .form-group { flex: 1; min-width: 150px; }

  .table-container { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 12px 8px 0; text-align: left; border-bottom: 1px solid var(--edge); }
  th { color: var(--dim); font-weight: 600; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }

  .actions { display: flex; gap: 6px; }
  .btn { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--edge); border-radius: 2px; background: transparent; color: var(--muted); cursor: pointer; min-height: 26px; }
  .btn:hover { color: var(--ink); border-color: var(--edge-strong); }
  .btn:focus-visible { outline: 2px solid var(--warning); outline-offset: 2px; }
  .btn-primary { color: var(--ground); background: var(--ink); border-color: var(--ink); font-weight: 600; }
  .btn-danger { color: #fff; background: var(--error); border-color: var(--error); }
  .btn-sm { padding: 2px 8px; font-size: 11.5px; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-header h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .section-header h2 em { font-style: normal; font-weight: 400; letter-spacing: 0.02em; text-transform: none; color: var(--dim); }

  /* Capacidades do modelo: chave de sinalização, não checkbox cru.
     O input fica invisível dentro da linha; para a leitura de tela segue
     sendo um checkbox, para o olho é uma placa com nome, descrição e
     interruptor — o estado ligado é a lâmpada verde, não só o texto. */
  .cap-group { display: grid; border: 1px solid var(--edge); border-radius: 2px; background: var(--panel); }
  .cap { position: relative; border-bottom: 1px solid var(--edge); }
  .cap:last-child { border-bottom: 0; }
  .cap-input { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .cap > label { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; cursor: pointer; }
  .cap-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .cap-desc { color: var(--dim); font-size: 12px; flex: 1; min-width: 0; }
  @media (max-width: 480px) {
    .cap-desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }
  .cap-track { position: relative; flex: none; width: 36px; height: 20px; border: 1px solid var(--edge-strong); border-radius: 980px; background: var(--panel-2); transition: background 150ms cubic-bezier(0.2, 0, 0, 1), border-color 150ms cubic-bezier(0.2, 0, 0, 1); }
  .cap-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--dim); transition: transform 150ms cubic-bezier(0.2, 0, 0, 1), background 150ms cubic-bezier(0.2, 0, 0, 1); }
  .cap-input:checked ~ label .cap-track { background: var(--good); border-color: var(--good); }
  .cap-input:checked ~ label .cap-track::after { transform: translateX(16px); background: var(--ground); }
  .cap:hover .cap-track { border-color: var(--edge-strong); }
  .cap-input:focus-visible ~ label .cap-track { outline: 2px solid var(--warning); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .cap-track, .cap-track::after { transition: none; }
  }

  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 2px; padding: 15px 17px 17px; margin-bottom: 20px; }
  .card h3 { margin: 0 0 12px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }

  .inline-form { display: inline; }
  .checkbox-group { display: flex; align-items: center; gap: 8px; }
  .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--warning); }

  .empty-state { color: var(--dim); padding: 20px; text-align: center; }

  .history-table td { font-family: var(--mono); font-size: 12px; }
  .history-table .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  @media (max-width: 760px) {
    .form-grid { grid-template-columns: 1fr; }
    .admin-nav { justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <h1>SHU<span>N</span>T</h1>
  {% include "_nav.html" %}
</header>

<main style="padding: 20px; display: grid; gap: 20px; max-width: 1400px; margin: 0 auto;">
  <!-- Providers Section -->
  <section class="card" id="providers-section">
    <div class="section-header">
      <h2>Provedores</h2>
      <button class="btn btn-primary" hx-get="/admin/config/providers/new" hx-target="#provider-form" hx-swap="outerHTML">Novo</button>
    </div>
    <div id="providers-list">{% include "_providers.html" %}</div>
    <div id="provider-form"></div>
  </section>

  <!-- Models Section -->
  <section class="card" id="models-section">
    <div class="section-header">
      <h2>Modelos</h2>
      <button class="btn btn-primary" hx-get="/admin/config/models/new" hx-target="#model-form" hx-swap="outerHTML">Novo</button>
    </div>
    <div id="models-list">{% include "_models.html" %}</div>
    <div id="model-form"></div>
  </section>

  <!-- Routes Section -->
  <section class="card" id="routes-section">
    <div class="section-header">
      <h2>Rotas e Fallback</h2>
      <button class="btn btn-primary" hx-get="/admin/config/routes/new" hx-target="#route-form" hx-swap="outerHTML">Nova Rota</button>
    </div>
    <div id="routes-list">{% include "_routes.html" %}</div>
    <div id="route-form"></div>
  </section>

  <!-- Default Model Section -->
  <section class="card" id="default-section">
    <div class="section-header">
      <h2>Modelo Padrão</h2>
    </div>
    <div id="default-content">{% include "_default.html" %}</div>
  </section>

  <!-- History Section -->
  <section class="card" id="history-section">
    <div class="section-header">
      <h2>Histórico de Versões</h2>
      <button class="btn" hx-get="/admin/config/history" hx-target="#history-content" hx-swap="innerHTML">Atualizar</button>
    </div>
    <div id="history-content">{% include "_history.html" %}</div>
  </section>

  <!-- Reload Button -->
  <section class="card">
    <div class="section-header">
      <h2>Recarregar Configuração</h2>
    </div>
    <button class="btn btn-primary" hx-post="/admin/config/reload" hx-target="#reload-result" hx-swap="innerHTML">Recarregar do Banco</button>
    <div id="reload-result" style="margin-top: 12px;"></div>
  </section>
</main>

<script src="https://unpkg.com/htmx.org@1.9.12"></script>
</body>
</html>
