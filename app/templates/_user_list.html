<!-- A ancora #user-list via no proprio fragmento: o swap outerHTML dos
     botoes de acao re-insere o div, mantendo o alvo vivo apos cada troca. -->
<div id="user-list">
{% if not users %}
<div class="empty-state">Nenhum usuario ainda.</div>
{% else %}
<div class="table-container">
<table>
  <thead>
    <tr><th>Usuário</th><th>Último acesso</th><th class="actions"></th></tr>
  </thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td class="mono">{{ u.last_login_at.strftime("%Y-%m-%d %H:%M") if u.last_login_at else "—" }}</td>
      <td class="actions" style="justify-content: flex-end;">
        <button class="btn btn-sm" hx-get="/admin/users/{{ u.username }}/edit" hx-target="#user-form" hx-swap="outerHTML">Editar</button>
        <button class="btn btn-sm btn-danger" hx-delete="/admin/users/{{ u.username }}" hx-target="#user-list" hx-swap="outerHTML"
          hx-confirm="Excluir {{ u.username }}?">Excluir</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endif %}
</div>
