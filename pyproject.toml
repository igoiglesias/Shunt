[project]
name = "shunt"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "sqlalchemy-libsql>=0.2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "mypy>=2.3.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.coverage.report]
fail_under = 100
precision = 0
omit = [
    "*/templates/*.html",
    "*/conftest.py",
    "*/test_*.py",
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
